  /* ---------- din ka hisaab (close day) ---------- */
  async function dayCloseSheet() {
    const C = window.SONE_CONFIG, T = x => TT_(x);
    let day = dayStr(), text = '';
    const sh = sheet(`<div class="sh-head"><h3>${T('Din ka hisaab')}</h3><button class="iconbtn" data-close>✕</button></div>
      <div class="pad" style="padding-top:0"><input class="inp" id="dc-day" type="date" value="${day}" max="${dayStr()}"></div>
      <div class="sh-body" id="dc-body"><div class="spin"></div></div>
      <div class="sh-foot"><div class="row gap8"><button class="btn green grow" id="dc-wa">💬 ${T('WhatsApp par bhejein')}</button><button class="btn sec grow" id="dc-cp">${T('Copy karein')}</button><button class="btn sec grow" id="dc-pr">🖨 ${T('Print karein')}</button></div></div>`, { full: true });
    const body = $('#dc-body', sh.el);
    async function load() {
      body.innerHTML = '<div class="spin"></div>';
      const from = startOfDay(day), to = new Date(from.getTime() + 86400e3);
      const [o, p] = await Promise.all([
        sb.from('orders').select('*').gte('created_at', from.toISOString()).lt('created_at', to.toISOString()).limit(5000),
        sb.from('pos_sales').select('*').eq('bill_date', day).is('deleted_at', null).limit(5000)]);
      if (o.error || p.error) { body.innerHTML = '<div class="empty">' + esc((o.error || p.error).message) + '</div>'; return; }
      const all = o.data || [], ord = all.filter(x => x.status !== 'cancelled'), canc = all.length - ord.length, pos = p.data || [];
      const posAmt = x => Number(x.subtotal) - Number(x.discount || 0), sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
      const oAmt = sum(ord, x => Number(x.total)), pAmt = sum(pos, posAmt);
      const cash = sum(pos, x => Number(x.cash)) + sum(ord.filter(x => x.payment_status === 'paid' && x.payment_method !== 'upi'), x => Number(x.total));
      const upi = sum(pos, x => Number(x.online)) + sum(ord.filter(x => x.payment_status === 'paid' && x.payment_method === 'upi'), x => Number(x.total));
      const udh = sum(pos, x => Number(x.udhaar));
      const top = {}; ord.forEach(x => (x.items || []).forEach(i => top[i.name] = (top[i.name] || 0) + Number(i.qty))); pos.forEach(x => (x.items || []).forEach(i => top[i.name] = (top[i.name] || 0) + Number(i.qty)));
      const topL = Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 5);
      let staff = []; try { staff = await Staff.perfData(day, day); } catch (e) {}
      const nice = new Date(day + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      const m = money;
      const L = [
        ['Total sale', m(oAmt + pAmt), true], ['Online orders', ord.length + ' · ' + m(oAmt)], ['Counter bills', pos.length + ' · ' + m(pAmt)],
        ['Cash mila', m(cash)], ['Online/UPI mila', m(upi)], ['Udhaar diya', m(udh)], ['Cancelled orders', String(canc)]];
      text = `*${C.RESTAURANT.toUpperCase()}*\n${T('Din ka hisaab')} · ${nice}\n--------------\n` + L.map(r => `${T(r[0])}: ${r[2] ? '*' + r[1] + '*' : r[1]}`).join('\n') +
        (topL.length ? `\n--------------\n*${T('Top dishes')}*\n` + topL.map((t, i) => `${i + 1}. ${t[0]} × ${t[1]}`).join('\n') : '') +
        (staff.length ? `\n--------------\n*${T('Staff ka hisaab')}*\n` + staff.map(r => `${r.name}: ${m(r.tkA + r.acA)} (${r.tk} + ${r.ac})`).join('\n') : '');
      body.innerHTML = `<div class="small muted" style="padding:0 20px 8px">${esc(nice)}</div>
        <div class="tile" style="margin:0 16px 12px;background:var(--brand);color:#fff"><div class="l" style="color:rgba(255,255,255,.85)">${T('Total sale')}</div><div class="v">${m(oAmt + pAmt)}</div></div>
        <div class="list">${L.slice(1).map(r => `<div class="li"><span class="grow t">${T(r[0])}</span><b>${esc(r[1])}</b></div>`).join('')}</div>
        ${topL.length ? `<div class="section-h">${T('Top dishes')}</div><div class="card">${topL.map((t, i) => `<div class="rank"><span class="n">${i + 1}</span><span class="grow">${esc(t[0])}</span><b>${t[1]}</b></div>`).join('')}</div>` : ''}
        ${staff.length ? `<div class="section-h">${T('Staff ka hisaab')}</div><div class="list">${staff.map(r => `<div class="li"><span class="grow t">${esc(r.name)}</span><b>${m(r.tkA + r.acA)}</b></div>`).join('')}</div>` : ''}<div style="height:12px"></div>`;
    }
    $('#dc-day', sh.el).onchange = e => { day = e.target.value || dayStr(); load(); };
    $('#dc-wa', sh.el).onclick = async () => { if (!text) return; if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } } window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank'); };
    $('#dc-cp', sh.el).onclick = async () => { try { await navigator.clipboard.writeText(text); toast(T('Copy ho gaya ✓'), 'ok'); } catch (e) { toast('Copy nahi hua', 'err'); } };
    $('#dc-pr', sh.el).onclick = () => Staff.printHTML(`<div style="width:72mm;margin:0 auto;font:13px/1.45 Arial,sans-serif;color:#000;padding:6px;white-space:pre-wrap">${esc(text.replace(/\*/g, ''))}</div>`);
    load();
  }

  /* ---------- poora backup ---------- */
  async function backupNow(btn) {
    const T = x => TT_(x), tables = ['menu_items', 'orders', 'pos_sales', 'customers', 'settings'], out = { app: 'sone-restaurant', exported_at: new Date().toISOString(), tables: {} };
    if (btn) btn.disabled = true; toast(T('Backup ban raha hai…'));
    try {
      for (const t of tables) {
        let all = [], from = 0;
        for (;;) { const { data, error } = await sb.from(t).select('*').range(from, from + 999); if (error) throw new Error(t + ': ' + error.message); all = all.concat(data || []); if (!data || data.length < 1000) break; from += 1000; }
        out.tables[t] = all;
      }
      try { const { data } = await sb.from('staff').select('id,name,role,active,phone,created_at'); out.tables.staff = data || []; } catch (e) {}
      const blob = new Blob([JSON.stringify(out)], { type: 'application/json' }), u = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = u; a.download = 'sone-backup-' + dayStr() + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 8000);
      ls.set('sone_last_backup', new Date().toISOString()); toast(T('Backup download ho gaya ✓'), 'ok'); if (Owner.tab === 'more') renderMore();
    } catch (e) { toast(T('Backup nahi bana:') + ' ' + (e.message || e), 'err'); } finally { if (btn) btn.disabled = false; }
  }

  /* ---------- backup se restore ---------- */
  function restoreSheet() {
    const T = x => TT_(x), NAMES = { menu_items: 'Menu', orders: 'Online / Table orders', pos_sales: 'Counter bills', customers: 'Customers', settings: 'Settings' };
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = async () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      let data; try { data = JSON.parse(await f.text()); } catch (e) { return toast(T('Galat backup file'), 'err'); }
      if (!data || data.app !== 'sone-restaurant' || !data.tables || typeof data.tables !== 'object') return toast(T('Galat backup file'), 'err');
      const keys = Object.keys(NAMES).filter(k => Array.isArray(data.tables[k]) && data.tables[k].length);
      if (!keys.length) return toast(T('Is backup mein koi data nahi hai'), 'err');
      const when = data.exported_at ? new Date(data.exported_at).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
      const sh = sheet(`<div class="sh-head"><h3>${T('Backup se wapas laayein (Restore)')}</h3><button class="iconbtn" data-close>✕</button></div><div class="sh-body">
        <div class="card"><div class="small muted">${T('Ye backup is samay ka hai')}</div><div class="bold" style="font-size:17px">${esc(when)}</div></div>
        <div class="section-h">${T('Kya wapas laana hai?')}</div>
        <div class="list">${keys.map(k => `<label class="li"><span class="grow t">${T(NAMES[k])}</span><span class="muted">${data.tables[k].length}</span><label class="sw"><input type="checkbox" data-k="${k}" checked><i></i></label></label>`).join('')}</div>
        <p class="xs muted pad">${T('Restore se purana data nahi hatega. Jis id ka data backup mein hai wo wapas ban jayega ya badal jayega; baaki data jaisa hai waisa rahega.')}</p></div>
        <div class="sh-foot"><button class="btn red block" id="rs-go">${T('Restore shuru karein')}</button></div>`, { full: true });
      $('#rs-go', sh.el).onclick = async e => {
        const b = e.currentTarget;
        const sel = $$('[data-k]', sh.el).filter(x => x.checked).map(x => x.dataset.k); if (!sel.length) return toast(T('Kuch to chunein'), 'err');
        if (!await confirmBox(T('Chuni hui cheezein backup se wapas daalein?'), T('Haan, restore karein'), true)) return;
        b.disabled = true; const bad = [];
        for (const k of sel) {
          const rows = data.tables[k]; b.textContent = T('Restore ho raha hai…') + ' ' + T(NAMES[k]);
          for (let i = 0; i < rows.length; i += 400) {
            const { error } = await sb.from(k).upsert(rows.slice(i, i + 400), k === 'settings' ? { onConflict: 'key' } : undefined);
            if (error) { bad.push(k + ': ' + error.message); break; }
          }
        }
        b.disabled = false; b.textContent = T('Restore shuru karein');
        if (bad.length) { toast(T('Restore poora nahi hua:') + ' ' + bad[0], 'err'); return; }
        await Owner.loadSettings().catch(() => {}); Staff.refresh(); toast(T('Restore ho gaya ✓'), 'ok'); sh.close();
      };
    };
    inp.click();
  }

  window.__setHere = b => { if (!navigator.geolocation) return toast(TT_('Is phone mein location support nahi hai'), 'err'); b.disabled = true; navigator.geolocation.getCurrentPosition(p => { b.disabled = false; $('#s-lat').value = p.coords.latitude.toFixed(6); $('#s-lng').value = p.coords.longitude.toFixed(6); toast(TT_('Location mil gayi — ab Save karein'), 'ok'); }, () => { b.disabled = false; toast(TT_('Location ki permission chahiye'), 'err'); }, { enableHighAccuracy: true, timeout: 15000 }); };
  async function staffSheet() {
    const sh = sheet(`<div class="sh-head"><h3>Staff</h3><button class="iconbtn" data-close>✕</button></div><div class="sh-body" id="st-body"><div class="spin"></div></div>`, { full: true });
    async function draw() {
      const { data } = await sb.from('staff').select('*').order('created_at'); const body = $('#st-body', sh.el);
      body.innerHTML = `<div class="list">${(data || []).map(s => `<div class="li"><div class="grow"><div class="t">${esc(s.name)}</div><div class="s">${s.role === 'owner' ? 'Owner' : 'Waiter'}${s.phone ? ' · 📞 ' + esc(s.phone) : ''}${s.active ? '' : ' · band'}</div></div>${s.id === Staff.me.id ? '<span class="pill">Aap</span>' : `<label class="sw"><input type="checkbox" data-sid="${s.id}" ${s.active ? 'checked' : ''}><i></i></label>`}</div>`).join('')}</div>
        <div class="section-h">Naya waiter jodein</div><div class="card"><label class="field"><span>Naam</span><input class="inp" id="w-name"></label>
        <label class="field"><span>Email (login ke liye)</span><input class="inp" id="w-mail" type="email" autocapitalize="off"></label>
        <label class="field"><span>Password (kam se kam 6 akshar)</span><input class="inp" id="w-pass" type="text" autocapitalize="off"></label>
        <button class="btn block" id="w-add">Waiter banayein</button></div>
        <p class="xs muted pad">Agar naya waiter login na kar paye to Supabase → Authentication → Providers → Email mein "Confirm email" OFF karein.</p>`;
      $$('[data-sid]', body).forEach(c => c.onchange = async () => { const { error } = await sb.from('staff').update({ active: c.checked }).eq('id', c.dataset.sid); if (error) { toast(error.message, 'err'); c.checked = !c.checked; } else toast(c.checked ? 'Chalu kiya' : 'Band kiya'); });
      $('#w-add', body).onclick = async () => {
        const name = $('#w-name', body).value.trim(), email = $('#w-mail', body).value.trim(), password = $('#w-pass', body).value;
        if (!name || !/^\S+@\S+\.\S+$/.test(email) || password.length < 6) return toast('Naam, sahi email aur 6+ akshar ka password likhein', 'err');
        const tmp = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
        const { data: r, error } = await tmp.auth.signUp({ email, password });
        if (error) return toast(error.message, 'err'); if (!r.user || (r.user.identities && !r.user.identities.length)) return toast('Ye email pehle se registered hai', 'err');
        const { error: e2 } = await sb.from('staff').insert({ id: r.user.id, name, role: 'waiter' }); if (e2) return toast(e2.message, 'err');
        toast('Waiter ban gaya ✓ (login: ' + email + ')', 'ok'); draw();
      };
    }
    draw();
  }

  async function udhaarSheet() {
    const sh = sheet(`<div class="sh-head"><h3>Udhaar baaki</h3><button class="iconbtn" data-close>✕</button></div><div class="sh-body" id="u-body"><div class="spin"></div></div>`, { full: true });
    async function draw() {
      const { data, error } = await sb.from('pos_sales').select('*').gt('udhaar', 0).is('deleted_at', null).order('created_at', { ascending: false }); const body = $('#u-body', sh.el);
      if (error) return body.innerHTML = '<div class="empty">' + esc(error.message) + '</div>';
      if (!data.length) return body.innerHTML = '<div class="empty"><div class="big">🎉</div>Koi udhaar baaki nahi</div>';
      const tot = data.reduce((a, r) => a + Number(r.udhaar), 0);
      body.innerHTML = `<div class="card"><div class="small muted">Kul baaki</div><div style="font-size:28px;font-weight:700;color:var(--red)">${money(tot)}</div></div><div class="list">${data.map(r => `<div class="li"><div class="grow"><div class="t">${esc(r.customer_name || 'Naam nahi')}</div><div class="s">Bill #${r.bill_no} · ${r.bill_date}</div></div><b>${money(r.udhaar)}</b><button class="btn sm green" data-rcv="${r.id}">Mil gaya</button></div>`).join('')}</div>`;
      $$('[data-rcv]', body).forEach(b => b.onclick = async () => { const r = data.find(x => x.id == b.dataset.rcv); if (!await confirmBox(`${money(r.udhaar)} cash mil gaya?`, 'Haan')) return;
        const { error: e } = await sb.from('pos_sales').update({ cash: Number(r.cash) + Number(r.udhaar), udhaar: 0 }).eq('id', r.id); if (e) return toast(e.message, 'err'); toast('Udhaar clear ✓', 'ok'); draw(); });
    }
    draw();
  }

  function exportSheet() {
    const sh = sheet(`<div class="sh-head"><h3>Hisaab download</h3><button class="iconbtn" data-close>✕</button></div><div class="sh-body"><div class="card">
      <label class="field"><span>Kab se</span><input class="inp" type="date" id="x-from" value="${dayStr(new Date(Date.now() - 6 * 86400e3))}"></label>
      <label class="field"><span>Kab tak</span><input class="inp" type="date" id="x-to" value="${dayStr()}"></label>
      <button class="btn block" id="x-go">CSV download karein</button></div><p class="xs muted pad">Excel / Google Sheets mein khul jayegi. Online orders aur counter bills dono.</p></div>`);
    $('#x-go', sh.el).onclick = async () => {
      const f = $('#x-from', sh.el).value, t = $('#x-to', sh.el).value; if (!f || !t || f > t) return toast('Date sahi chunein', 'err');
      const [o, p] = await Promise.all([
        sb.from('orders').select('*').gte('created_at', startOfDay(f).toISOString()).lt('created_at', new Date(startOfDay(t).getTime() + 86400e3).toISOString()).order('created_at').limit(5000),
        sb.from('pos_sales').select('*').gte('bill_date', f).lte('bill_date', t).is('deleted_at', null).order('bill_date')]);
      if (o.error || p.error) return toast((o.error || p.error).message, 'err');
      const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"', rows = [['Type', 'Date', 'Time', 'No', 'Customer', 'Phone', 'Order type', 'Items', 'Total', 'Discount', 'Cash', 'Online', 'Udhaar', 'Payment', 'Status']];
      o.data.forEach(x => rows.push(['Online', dayStr(new Date(x.created_at)), fmtTime(x.created_at), x.order_no, x.customer_name, x.phone, x.order_type, (x.items || []).map(i => i.qty + 'x ' + i.name).join('; '), x.total, x.discount, '', '', '', x.payment_method + '/' + x.payment_status, x.status]));
      p.data.forEach(x => rows.push(['POS', x.bill_date, fmtTime(x.created_at), x.bill_no, x.customer_name || '', '', 'counter', (x.items || []).map(i => i.qty + 'x ' + i.name).join('; '), Number(x.subtotal) - Number(x.discount), x.discount, x.cash, x.online, x.udhaar, '', 'billed']));
      const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `sone_hisaab_${f}_to_${t}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('Download ho gaya ✓', 'ok');
    };
  }

  /* ---------- boot ---------- */
  Staff.init({
    roles: ['owner'], title: 'Owner Login', subtitle: 'Sone Restaurant · poora control',
    async onReady() { Staff.fromDate = new Date(Date.now() - 8 * 86400e3).toISOString(); await Owner.loadSettings(); Staff.startLive(); tab('home'); }
  });
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
<script>/* Customers tab: saved mobiles + WhatsApp messages (photo / text) */
(function () {
  const C = window.SONE_CONFIG, tt = x => (window.SONE_TR ? window.SONE_TR(x) : x), norm = p => String(p || '').replace(/\D/g, '').slice(-10);
  const FF = "Arial,'Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Gujarati','Noto Sans Tamil','Noto Sans Telugu',Helvetica,sans-serif";
  const COL = ['#FF9500', '#34C759', '#007AFF', '#AF52DE', '#FF2D55', '#30B0C7', '#5856D6'];
  const TPL = { offer: 'Namaste {name}! 🙏\n🎉 Sone Restaurant mein aaj aapke liye khaas offer hai!\n😋 Swaadisht khane ka maza lene zaroor aaiye.\nAapka intezaar rahega! ✨', thanks: 'Dhanyavaad {name}! 🙏\nSone Restaurant mein khana khane ke liye bahut shukriya. ❤️\nAapki muskaan hamari kamaayi hai — phir zaroor aaiyega! 😊', newitem: 'Namaste {name}! 🍽️\nSone Restaurant ke menu mein naye swaadisht dishes judi hain! 😍\nAakar zaroor try karein aur apna review batayein. ⭐', party: 'Namaste {name}! 🎊\nBirthday, Anniversary ya Kitty Party — Sone Restaurant ka Party Hall aapki har khushi ko yaadgaar banayega! 🎂\nAbhi booking ke liye humse sampark karein. 📞', festival: '{name}, aapko aur aapke parivaar ko tyohar ki hardik shubhkaamnayein! 🪔✨\nIs khushi mein Sone Restaurant ke saath apna din aur khaas banayein. 😋' };
  let LIST = [], sel = new Set(), q = '', mode = 'photo', MSG = '', ok = true;
  const initial = c => (c.name || c.phone || '?').trim().charAt(0).toUpperCase(), colr = c => COL[parseInt(String(c.phone).slice(-2), 10) % COL.length];
  const fill = (t, name) => t.replace(/\{name\}/g, name || '').replace(/\s+([!,.])/g, '$1').replace(/\s{2,}/g, ' ').trim();
  window.touchCustomer = async (phone, name, amount, visit) => { phone = norm(phone); if (phone.length !== 10) return; const { error } = await sb.rpc('touch_customer', { p_phone: phone, p_name: name || null, p_amount: amount || 0, p_visit: visit !== false }); return error; };
  async function load() { const { data, error } = await sb.from('customers').select('*').order('last_visit', { ascending: false, nullsFirst: false }).limit(1000); ok = !error; LIST = error ? [] : (data || []); }

  async function msgImage(text) {
    const W = 1080, mc = document.createElement('canvas').getContext('2d'), cx = 70, cy = 490, cw = W - 140, maxW = cw - 120, rt = tt('Special message');
    const src = (document.querySelector('.navbar img') || {}).src, logo = await new Promise(r => { if (!src) return r(null); const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
    const wrap = z => { mc.font = `600 ${z}px ${FF}`; const out = []; String(text).split('\n').forEach(par => { let cur = ''; par.split(' ').forEach(w => { const t = cur ? cur + ' ' + w : w; if (mc.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }); out.push(cur); }); return out; };
    let fs = 46, lines = wrap(fs); while (lines.length * fs * 1.5 > 520 && fs > 28) { fs -= 2; lines = wrap(fs); }
    const ch = 150 + lines.length * fs * 1.5 + 150, H = Math.ceil(cy + ch + 190), cv = document.createElement('canvas'); cv.width = W; cv.height = H; const c = cv.getContext('2d');
    const rr = (x, y, w, h, r) => { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
    let g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#9AA5FF'); g.addColorStop(.55, '#5B6CE0'); g.addColorStop(1, '#3A47A8'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    [[W * .85, 120, 420, .18], [120, H * .7, 480, .13], [W * .6, H * .97, 380, .1]].forEach(([x, y, r, a]) => { const rg = c.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, `rgba(255,255,255,${a})`); rg.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = rg; c.fillRect(0, 0, W, H); });
    c.save(); c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 40; c.shadowOffsetY = 16; rr(440, 90, 200, 200, 46); c.fillStyle = '#fff'; c.fill(); c.restore();
    if (logo) { c.save(); rr(440, 90, 200, 200, 46); c.clip(); const sc = 168 / Math.max(logo.width, logo.height); c.drawImage(logo, 540 - logo.width * sc / 2, 190 - logo.height * sc / 2, logo.width * sc, logo.height * sc); c.restore(); }
    c.textAlign = 'center'; c.fillStyle = '#fff'; c.font = `800 62px ${FF}`; c.fillText(C.RESTAURANT.toUpperCase(), W / 2, 385); c.font = `500 30px ${FF}`; c.fillStyle = 'rgba(255,255,255,.85)'; c.fillText(C.ADDRESS, W / 2, 432);
    c.save(); c.shadowColor = 'rgba(0,0,0,.28)'; c.shadowBlur = 50; c.shadowOffsetY = 20; rr(cx, cy, cw, ch, 56); c.fillStyle = 'rgba(255,255,255,.97)'; c.fill(); c.restore();
    c.font = `700 28px ${FF}`; const pw = c.measureText(rt).width + 56; rr(cx + 60, cy + 50, pw, 56, 28); c.fillStyle = 'rgba(91,108,224,.14)'; c.fill(); c.fillStyle = '#4655C7'; c.textAlign = 'left'; c.fillText(rt, cx + 88, cy + 89);
    c.fillStyle = '#1C1C1E'; c.font = `600 ${fs}px ${FF}`; lines.forEach((l, i) => c.fillText(l, cx + 60, cy + 150 + fs + i * fs * 1.5 - fs * .25));
    c.strokeStyle = 'rgba(60,60,67,.18)'; c.lineWidth = 2; c.beginPath(); c.moveTo(cx + 60, cy + ch - 110); c.lineTo(cx + cw - 60, cy + ch - 110); c.stroke();
    c.fillStyle = '#3C3C43'; c.font = `500 28px ${FF}`; c.textAlign = 'center'; c.fillText(tt('Mob') + ': ' + C.WHATSAPP.slice(2), W / 2, cy + ch - 52);
    c.fillStyle = '#fff'; c.font = `700 38px ${FF}`; c.fillText(tt('Dhanyavaad! Phir aaiyega') + ' 🙏', W / 2, cy + ch + 100);
    return new Promise(r => cv.toBlob(r, 'image/png'));
  }
  async function sendImg(msg, phone) {
    const blob = await msgImage(msg); if (!blob) return false; const file = new File([blob], 'Sone-message.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], text: msg }); return true; } catch (e) { if (e && e.name === 'AbortError') return false; } }
    const u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 5000);
    toast('Bill ki photo save ho gayi — WhatsApp mein attach karke bhejein', 'ok'); setTimeout(() => window.open('https://wa.me/91' + phone, '_blank'), 700); return true;
  }

  const view = () => { const k = q.trim().toLowerCase(); return LIST.filter(c => !k || (c.name || '').toLowerCase().includes(k) || c.phone.includes(k)); };
  function drawRows() {
    const l = view();
    $('#cu-rows').innerHTML = l.length ? l.map(c => `<div class="li" data-p="${c.phone}" style="cursor:pointer"><span class="chk ${sel.has(c.phone) ? 'on' : ''}"></span><span class="av" style="background:${colr(c)}">${esc(initial(c))}</span><div class="grow" style="min-width:0"><div class="t">${esc(c.name || c.phone)}</div><div class="small muted">${c.phone}${c.visits ? ' · ' + c.visits + ' ' + tt('visits') + ' · ' + money(c.total_spent) : ''}</div></div><button class="iconbtn" data-del="${c.phone}" style="width:34px;height:34px">${IC('trash', '#FF3B30', 26)}</button></div>`).join('') : '<div class="muted small" style="padding:16px 20px">Abhi koi customer nahi. Bill mein mobile number likhein, ya ＋ se jodein.</div>';
    $('#cu-cnt').textContent = tt('Selected') + ': ' + sel.size; $('#cu-send').textContent = tt('Bhejein') + ' (' + sel.size + ')';
  }
  function build() {
    if (!ok) { $('#cu-body').innerHTML = `<div class="card" style="margin-top:12px"><div class="row" style="gap:12px;align-items:flex-start">${IC('gear', '#FF9500')}<div class="small">Customers ka database taiyar nahi. customers_setup.sql ko Supabase SQL Editor mein ek baar run karein.</div></div></div>`; return; }
    $('#cu-body').innerHTML = `<div class="card" style="margin-top:12px"><div class="row bold" style="font-size:18px;margin-bottom:10px;gap:10px">${IC('send', '#34C759')}Message likhein</div>
      <div class="cseg" id="cu-mode"><button data-md="photo" class="${mode === 'photo' ? 'on' : ''}">Photo</button><button data-md="text" class="${mode === 'text' ? 'on' : ''}">Text</button></div>
      <textarea class="inp mt8" id="cu-msg" rows="4" style="resize:none" placeholder="Yahan apna message likhein…">${esc(MSG)}</textarea>
      <div class="row gap8 mt8" style="flex-wrap:wrap"><button class="cchip" data-t="offer">Offer</button><button class="cchip" data-t="thanks">Dhanyavaad</button><button class="cchip" data-t="newitem">Naya item</button><button class="cchip" data-t="party">Party Hall</button><button class="cchip" data-t="festival">Tyohar</button><button class="cchip" id="cu-prev" style="margin-left:auto;color:#007AFF">Preview</button></div>
      <div class="xs muted mt8">{name} ki jagah customer ka naam lagega</div></div>
      <div class="pad" style="padding-bottom:0"><div class="search">${ICON.search}<input id="cu-q" placeholder="Customer dhoondhein…" value="${esc(q)}"></div></div>
      <div class="row between small" style="padding:10px 20px 4px"><button id="cu-all" class="bold" style="color:#007AFF">Sabko chunein</button><span class="muted" id="cu-cnt"></span></div>
      <div class="list" id="cu-rows"></div>
      <div class="pad"><button class="btn sec block" id="cu-imp">Online orders se jodein</button></div>
      <div class="billfoot"><button class="btn green block" id="cu-send"></button></div>`;
    drawRows();
    $('#cu-mode').onclick = e => { const b = e.target.closest('[data-md]'); if (!b) return; mode = b.dataset.md; $$('#cu-mode button').forEach(x => x.classList.toggle('on', x.dataset.md === mode)); };
    $('#cu-msg').oninput = e => { MSG = e.target.value; };
    $('#cu-q').oninput = e => { q = e.target.value; drawRows(); };
    $('#cu-body').onclick = async e => {
      const t = e.target.closest('[data-t]'), d = e.target.closest('[data-del]'), r = e.target.closest('[data-p]');
      if (t) { MSG = tt(TPL[t.dataset.t]); $('#cu-msg').value = MSG; }
      else if (d) { if (await confirmBox('Is customer ko hata dein?', 'Delete', true)) { const { error } = await sb.from('customers').delete().eq('phone', d.dataset.del); if (!error) { sel.delete(d.dataset.del); await load(); drawRows(); } } }
      else if (r) { const p = r.dataset.p; sel.has(p) ? sel.delete(p) : sel.add(p); drawRows(); }
      else if (e.target.closest('#cu-all')) { const l = view(), all = l.every(c => sel.has(c.phone)); l.forEach(c => all ? sel.delete(c.phone) : sel.add(c.phone)); drawRows(); }
      else if (e.target.closest('#cu-prev')) preview();
      else if (e.target.closest('#cu-send')) startSend();
      else if (e.target.closest('#cu-imp')) importOrders();
    };
  }
  async function preview() {
    const raw = ($('#cu-msg').value || '').trim(); if (!raw) return toast('Pehle message likhein', 'err');
    const blob = await msgImage(fill(raw, '')); if (!blob) return; const url = URL.createObjectURL(blob);
    sheet(`<div class="sh-head"><h3>Preview</h3><button class="iconbtn" data-close>✕</button></div><div class="sh-body"><img src="${url}" alt="" style="width:calc(100% - 32px);margin:0 16px;border-radius:16px;display:block"></div>`, { full: true });
  }
  function startSend() {
    if (!sel.size) return toast('Pehle customer chunein', 'err');
    const raw = ($('#cu-msg').value || '').trim(); if (!raw) return toast('Pehle message likhein', 'err');
    const L = LIST.filter(c => sel.has(c.phone)); let i = 0;
    const sh = sheet(`<div class="sh-head"><h3>Bhejein</h3><button class="iconbtn" data-close>✕</button></div><div class="sh-body" id="q-body"></div><div class="sh-foot"><button class="btn green block" id="q-go">WhatsApp kholein</button><button class="btn sec block mt8" id="q-skip">Skip</button></div>`, {});
    const paint = () => { const c = L[i]; $('#q-body', sh.el).innerHTML = `<div class="card" style="text-align:center"><span class="av" style="margin:0 auto 8px;width:56px;height:56px;font-size:22px;background:${colr(c)}">${esc(initial(c))}</span><div class="bold" style="font-size:18px">${esc(c.name || c.phone)}</div><div class="muted">${c.phone}</div><div class="small muted mt8">${i + 1} / ${L.length}</div></div>${mode === 'photo' ? '<p class="xs muted pad">Photo ke liye: share menu mein WhatsApp chunkar upar wale number ko bhejein.</p>' : ''}`; };
    const next = () => { i++; if (i >= L.length) { sh.close(); toast('Sab customers ho gaye ✓', 'ok'); } else paint(); };
    $('#q-skip', sh.el).onclick = next;
    $('#q-go', sh.el).onclick = async e => { const b = e.currentTarget; b.disabled = true; const c = L[i], msg = fill(raw, c.name); let done = true;
      try { if (mode === 'text') window.open('https://wa.me/91' + c.phone + '?text=' + encodeURIComponent(msg), '_blank'); else done = await sendImg(msg, c.phone); } finally { b.disabled = false; }
      if (done) next(); };
    paint();
  }
  function addSheet() {
    const sh = sheet(`<div class="sh-head"><h3>Naya customer</h3><button class="iconbtn" data-close>✕</button></div><div class="sh-body"><div class="card"><label class="field"><span>Naam</span><input class="inp" id="ca-n"></label><label class="field" style="margin:0"><span>Mobile number</span><input class="inp" id="ca-p" type="tel" inputmode="numeric" maxlength="10"></label></div></div><div class="sh-foot"><button class="btn block" id="ca-s">Save karein</button></div>`, {});
    $('#ca-s', sh.el).onclick = async () => { const p = norm($('#ca-p', sh.el).value); if (p.length !== 10) return toast('10 digit mobile number likhein', 'err'); const e = await touchCustomer(p, $('#ca-n', sh.el).value.trim(), 0, false); if (e) return toast(e.message, 'err'); sh.close(); await load(); build(); };
  }
  async function importOrders() {
    const seen = new Map(); ((window.Staff && Staff.orders) || []).forEach(o => { const p = norm(o.phone); if (p.length === 10 && !seen.has(p)) seen.set(p, o.customer_name); });
    let n = 0; for (const [p, nm] of seen) { if (LIST.some(c => c.phone === p)) continue; if (!(await touchCustomer(p, nm, 0, false))) n++; }
    toast(n + ' ' + tt('Customers'), 'ok'); await load(); build();
  }
  window.CustUI = { show: async () => { await load(); build(); } };
  const ab = $('#cu-add'); if (ab) ab.onclick = addSheet;
})();
</script>

    mo.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTR });
    walk(document.head && document.querySelector('title'));
    var t = document.querySelector('title'); if (t && t.firstChild) { try { t.firstChild.nodeValue = tr(t.firstChild.nodeValue); } catch (e) {} }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
<script>/* Sone staff apps: bottom "App install karein" button */
(function () {
  var dp = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); dp = e; });
  window.addEventListener('appinstalled', function () { var b = document.getElementById('install-box'); if (b) b.style.display = 'none'; dp = null; });
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  function init() {
    if (standalone || document.getElementById('install-box')) return;
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    var b = document.createElement('div'); b.id = 'install-box';
    b.innerHTML = '<button type="button" id="install-btn">📲 App install karein</button><div id="install-hint" class="hide" style="display:none"></div>';
    var st = document.createElement('style');
    st.textContent = '#install-box{margin:22px 16px 0;padding:12px;border-radius:18px;background:var(--card,#fff);box-shadow:var(--shadow,0 1px 3px rgba(0,0,0,.08));text-align:center}#install-btn{width:100%;padding:13px;border-radius:12px;background:var(--brand,#5B6CE0);color:#fff;font-size:15px;font-weight:700;border:0;}#install-btn:active{transform:scale(.98)}#install-hint{margin-top:8px;font-size:13px;color:var(--label2,#666);line-height:1.4}';
    document.head.appendChild(st);
    var lb = document.getElementById('langbar'), home = (document.getElementById('lang-slot') || document.querySelector('#v-account,#v-me,#v-more')) || document.querySelector('main.view');
    if (lb && lb.parentNode) lb.parentNode.insertBefore(b, lb); else if (home) home.appendChild(b); else document.body.appendChild(b);
    document.getElementById('install-btn').onclick = function () {
      if (dp) { dp.prompt(); dp.userChoice.then(function () { dp = null; }); return; }
      var h = document.getElementById('install-hint');
      h.textContent = ios ? 'iPhone: Safari mein Share ▸ Add to Home Screen dabayein' : 'Browser menu (⋮) mein Install app / Add to Home screen dabayein';
      h.style.display = 'block'; h.classList.remove('hide');
    };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
