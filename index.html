<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Sone Restro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #f1f5f9; display: flex; height: 100vh; overflow: hidden; }
        
        /* LOGIN SCREEN */
        #login-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 2000; flex-direction: column; }
        .login-box { background: white; padding: 40px 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-logo { width: 160px; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; outline: none; }
        .login-box input:focus { border-color: #d32f2f; }
        .login-btn { width: 100%; background: #d32f2f; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .login-btn:active { background: #b91c1c; }

        /* DASHBOARD */
        #dashboard { display: none; width: 100%; height: 100%; }
        
        /* SIDEBAR */
        .sidebar { width: 260px; background: #1e293b; color: white; display: flex; flex-direction: column; padding: 25px 20px; }
        .sidebar-logo { width: 120px; align-self: center; margin-bottom: 40px; background: white; padding: 10px; border-radius: 12px; }
        .menu-item { padding: 15px 20px; margin-bottom: 10px; background: transparent; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 15px; transition: 0.2s; }
        .menu-item:hover { background: #334155; }
        .menu-item.active { background: #d32f2f; color: white; }
        .logout-btn { margin-top: auto; background: transparent; border: 2px solid #ef4444; color: #ef4444; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; text-align: center; }

        /* MAIN CONTENT */
        .main-content { flex: 1; padding: 25px; overflow-y: auto; background: #f8fafc; }
        .topbar { background: white; padding: 18px 25px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 25px; }
        .topbar h2 { color: #0f172a; font-size: 22px; }
        .sync-badge { background: #10b981; color: white; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .pulse { width: 8px; height: 8px; background: white; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .order-card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.04); border-left: 6px solid #d32f2f; }
        .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 12px; }
        .order-header h3 { color: #1e293b; margin:0; font-size: 18px; }
        .order-header h2 { margin:0; color: #10b981; font-size: 20px; }
        
        .detail { margin-bottom: 8px; font-size: 14px; color: #64748b; display: flex; justify-content: space-between; }
        .detail strong { color: #334155; }
        .item-list { background: #f1f5f9; padding: 10px; border-radius: 8px; color: #d32f2f; font-weight: 600; font-size: 14px; margin: 10px 0; }
        .utr-box { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; padding: 4px 10px; border-radius: 6px; font-family: monospace; font-weight: bold; }
        
        .call-btn { display: block; background: #3b82f6; color: white; text-decoration: none; padding: 12px; border-radius: 10px; text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .call-btn:active { background: #2563eb; }

        @media (max-width: 768px) {
            .sidebar { display: none; } /* Hide sidebar on mobile to show full orders */
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-box">
            <img src="./sonelogo1_2.png" class="login-logo" alt="Sone Logo" onerror="this.src='./sonelogo_2.png'">
            <h2 style="margin-bottom: 25px; color:#1e293b;">Admin Login</h2>
            <input type="text" id="username" placeholder="Username (admin)">
            <input type="password" id="password" placeholder="Password (12345)">
            <button class="login-btn" onclick="handleLogin()">LOGIN TO DASHBOARD</button>
            <p id="error-msg" style="color:#ef4444; margin-top:15px; display:none; font-weight:bold;">Incorrect details!</p>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <img src="./sonelogo_2.png" class="sidebar-logo" alt="Logo">
            <div class="menu-item active">📋 Live Orders</div>
            <div class="menu-item">👥 Customers</div>
            <div class="menu-item">⚙️ Settings</div>
            <div class="logout-btn" onclick="handleLogout()">LOGOUT</div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="topbar">
                <h2>Restaurant Dashboard</h2>
                <span class="sync-badge"><div class="pulse"></div> Auto Sync</span>
            </div>
            
            <div id="orders-container" class="order-grid">
                <p style="grid-column: 1/-1; text-align:center; margin-top:50px; color:#94a3b8; font-size:18px;">Loading orders...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gvsimqxwfuugugssvcus.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2c2ltcXh3ZnV1Z3Vnc3N2Y3VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NTcwOTUsImV4cCI6MjEwNjMzMzA5NX0.b1aIHuURJ4jqy7T9ulzzD9e5O7fjTcuer0_QhPlZTKk';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Session Logic (Local Storage)
        window.onload = () => {
            if (localStorage.getItem('sone_admin_logged_in') === 'true') {
                showDashboard();
            }
        };

        function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if (user === 'admin' && pass === '12345') {
                localStorage.setItem('sone_admin_logged_in', 'true');
                showDashboard();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function handleLogout() {
            localStorage.removeItem('sone_admin_logged_in');
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('error-msg').style.display = 'none';
        }

        let orderInterval;
        function showDashboard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            fetchOrders();
            // Start fetching every 8 seconds
            if(orderInterval) clearInterval(orderInterval);
            orderInterval = setInterval(fetchOrders, 8000);
        }

        async function fetchOrders() {
            let { data: orders, error } = await supabase.from('orders').select('*').order('id', { ascending: false });

            const container = document.getElementById('orders-container');
            if (error) { 
                container.innerHTML = `<p style="grid-column: 1/-1; color:red; text-align:center;">Error: ${error.message}</p>`;
                return; 
            }

            let html = '';
            if(orders.length === 0) {
                html = '<p style="grid-column: 1/-1; text-align:center; color:#94a3b8; font-size:18px;">No live orders right now.</p>';
            } else {
                orders.forEach(order => {
                    const timeStr = new Date(order.created_at).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
                    html += `
                        <div class="order-card">
                            <div class="order-header">
                                <h3>Order #${order.id}</h3>
                                <h2>₹${order.total_amount}</h2>
                            </div>
                            <div class="detail"><strong>Customer:</strong> <span>${order.customer_name}</span></div>
                            <div class="detail"><strong>Time:</strong> <span>${timeStr}</span></div>
                            
                            <div class="item-list">${order.items}</div>
                            
                            <div class="detail" style="margin-top:15px; align-items:center;">
                                <strong>Payment UTR:</strong> 
                                <span class="utr-box">${order.utr_id}</span>
                            </div>
                            
                            <a href="tel:${order.phone}" class="call-btn">📞 Call ${order.phone}</a>
                        </div>`;
                });
            }
            container.innerHTML = html;
        }
    </script>
</body>
</html>
