<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Sone Restaurant</title>
    
    <link rel="manifest" href="manifest_admin.json">
    <link rel="icon" type="image/png" href="sonelogo1.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; background: #f4f5f7; color: #1C1C1E; overflow-x: hidden; }
        
        /* LOGIN SCREEN (WITH BEAUTIFUL BACKGROUND) */
        #login-screen { position:fixed; top:0; left:0; width:100vw; height:100vh; background: url('sonfront.png') center/cover no-repeat; z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px; box-sizing: border-box;}
        .login-overlay { position:absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1;}
        .login-box { background: #ffffff; padding: 40px 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 100%; max-width: 360px; text-align: center; box-sizing: border-box; z-index: 2; position: relative;}
        .login-logo { width: 140px; height: 140px; object-fit: contain; margin: 0 auto 15px auto; display: block; }
        .login-input { width: 100%; padding: 14px 15px 14px 45px; border: 2px solid #E5E5EA; border-radius: 12px; box-sizing: border-box; font-size: 15px; font-weight: 500; outline: none; transition: 0.3s; margin-bottom: 15px;}
        .login-input:focus { border-color: #b31217; }
        .login-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #e52d27, #b31217); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 16px; box-shadow: 0 8px 20px rgba(229, 45, 39, 0.3); transition: 0.2s;}
        .login-btn:active { transform: scale(0.97); }

        /* DASHBOARD UI */
        #app-container { display: none; padding-bottom: 30px; }
        .header-banner { background: url('sonein.png') center/cover no-repeat; height: 180px; position: relative; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .header-overlay { background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(179,18,23,0.9)); position: absolute; width: 100%; height: 100%; top: 0; left: 0; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; box-sizing: border-box; color: white;}
        .header-overlay h1 { margin: 0; font-family: 'Montserrat'; font-size: 24px;}
        .header-overlay p { margin: 5px 0 0 0; font-size: 13px; opacity: 0.9;}
        
        .logout-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5); color: white; padding: 8px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; backdrop-filter: blur(5px);}

        .content-area { padding: 20px; margin-top: -20px; position: relative; z-index: 10;}
        
        .order-card { background: white; padding: 20px; border-radius: 16px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 6px solid #FF9500; transition: 0.3s;}
        .order-card.accepted { border-left-color: #34C759; opacity: 0.8;}
        .btn-accept { background: #34C759; color: white; border: none; padding: 12px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; font-size:15px; box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);}
        .item-list { font-size: 14px; color: #444; background: #f9f9f9; padding: 12px; border-radius: 10px; margin: 12px 0; border: 1px dashed #ddd;}
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-overlay"></div>
        <div class="login-box">
            <img src="sonelogo1.png" alt="Sone Logo" class="login-logo">
            <p style="color: #b31217; margin: 0 0 25px 0; font-size: 16px; font-weight: 700; font-family:'Montserrat';">ADMIN LOGIN</p>
            
            <div style="position: relative;">
                <i class="fas fa-envelope" style="position: absolute; left: 16px; top: 22px; transform: translateY(-50%); color: #8E8E93;"></i>
                <input type="email" id="login-email" placeholder="Email Address" class="login-input">
            </div>
            <div style="position: relative;">
                <i class="fas fa-lock" style="position: absolute; left: 16px; top: 22px; transform: translateY(-50%); color: #8E8E93;"></i>
                <input type="password" id="login-password" placeholder="Password" class="login-input">
            </div>
            
            <button onclick="loginUser()" class="login-btn">LOGIN SECURELY</button>
            <p id="login-error" style="color: #FF3B30; font-size: 13px; margin-top: 15px; font-weight: 600; min-height: 20px;"></p>
        </div>
    </div>

    <!-- 2. MAIN ADMIN DASHBOARD -->
    <div id="app-container">
        <div class="header-banner">
            <div class="header-overlay">
                <button class="logout-btn" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                <h1>Live Orders Dashboard</h1>
                <p><i class="fas fa-circle" style="color:#34C759; font-size:10px;"></i> Real-time Sync Active</p>
            </div>
        </div>

        <div class="content-area">
            <h3 style="margin: 0 0 15px 0; font-size: 18px; color: #1C1C1E;"><i class="fas fa-concierge-bell" style="color:#b31217;"></i> Recent Orders</h3>
            <div id="ordersContainer">Loading Orders...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gvsimqxwfuugugssvcus.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2c2ltcXh3ZnV1Z3Vnc3N2Y3VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NTcwOTUsImV4cCI6MjEwNjMzMzA5NX0.b1aIHuURJ4jqy7T9ulzzD9e5O7fjTcuer0_QhPlZTKk'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginScreen = document.getElementById('login-screen');
        const appContainer = document.getElementById('app-container');
        const loginError = document.getElementById('login-error');

        // Check if already logged in
        window.onload = async function() {
            const { data } = await supabaseClient.auth.getSession();
            if (data.session) {
                loginScreen.style.display = 'none';
                appContainer.style.display = 'block';
                fetchOrders();
            }
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw_admin.js').catch(err => console.log(err));
            }
        };

        // LOGIN LOGIC
        async function loginUser() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            loginError.innerText = "Checking Details...";
            
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                loginError.innerText = "Error: " + error.message;
            } else {
                loginScreen.style.display = 'none';
                appContainer.style.display = 'block';
                fetchOrders();
            }
        }

        async function logoutUser() {
            await supabaseClient.auth.signOut();
            appContainer.style.display = 'none';
            loginScreen.style.display = 'flex';
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
        }

        // FETCH ORDERS & REALTIME
        async function fetchOrders() {
            let container = document.getElementById('ordersContainer');
            const { data, error } = await supabaseClient.from('customer_orders').select('*').order('id', { ascending: false });
            
            if (error) { container.innerHTML = "Error loading orders."; return; }
            if (data.length === 0) { container.innerHTML = "<div style='text-align:center; padding:30px; color:#888;'>No new orders found.</div>"; return; }

            container.innerHTML = "";
            data.forEach(order => {
                let itemsHtml = "";
                if(order.items_json) { order.items_json.forEach(i => { itemsHtml += `• <b>${i.name}</b> (Qty: ${i.qty})<br>`; }); }
                let isPending = order.order_status.includes('Pending');
                
                let html = `
                <div class="order-card ${isPending ? '' : 'accepted'}">
                    <div style="display:flex; justify-content:space-between; font-weight:800; font-size:16px;">
                        <span>${order.order_id || 'N/A'}</span>
                        <span style="color:#b31217;">₹${order.total_amount}</span>
                    </div>
                    <div style="font-size:13px; color:#666; margin-top:5px;"><i class="fas fa-user"></i> ${order.customer_name} | <i class="fas fa-phone-alt"></i> ${order.phone}</div>
                    <div class="item-list">${itemsHtml}</div>
                    <div style="font-size:13px; font-weight:700; color:${isPending ? '#FF9500' : '#34C759'};">Status: ${order.order_status}</div>
                    ${isPending ? `<button class="btn-accept" onclick="acceptOrder('${order.order_id}')"><i class="fas fa-check-circle"></i> Accept & Confirm Payment</button>` : ''}
                </div>`;
                container.innerHTML += html;
            });
        }

        async function acceptOrder(orderId) {
            if(!orderId) return;
            const { error } = await supabaseClient.from('customer_orders').update({ order_status: 'Accepted & Preparing ✅' }).eq('order_id', orderId);
            if(!error) { fetchOrders(); } else { alert("Error accepting order."); }
        }

        // Auto Refresh logic just in case
        setInterval(fetchOrders, 15000);
    </script>
</body>
</html>
