<style>/* Sone - iOS style design system (teeno apps mein same) */
:root{
  --bg:#F2F2F7; --card:#fff; --card2:#F9F9FB; --label:#000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.16); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --yellow:#FFCC00; --brand:#5B6CE0; --brand-d:#4655C7;
  --blur:rgba(249,249,249,.82); --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.05);
  --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Gujarati","Noto Sans Tamil","Noto Sans Telugu","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000; --card:#1C1C1E; --card2:#2C2C2E; --label:#fff; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --brand:#8590FF; --brand-d:#6E79F0;
  --blur:rgba(29,29,31,.82); --shadow:0 0 0 .5px rgba(255,255,255,.06);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--label);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(64px + var(--sab));overscroll-behavior-y:none}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--blue);text-decoration:none}
img{max-width:100%}
.hide{display:none!important}
.muted{color:var(--label2)} .small{font-size:13px} .xs{font-size:12px} .bold{font-weight:600} .right{text-align:right}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.gap8{gap:8px} .mt8{margin-top:8px} .mt12{margin-top:12px} .mt16{margin-top:16px} .mb8{margin-bottom:8px}

/* views + large title */
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.navbar{position:sticky;top:0;z-index:30;background:var(--blur);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  padding:calc(10px + var(--sat)) 16px 8px;border-bottom:.5px solid var(--sep)}
.navbar .top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}
.largetitle{font-size:32px;font-weight:700;letter-spacing:-.5px;padding:8px 16px 4px}
.pad{padding:12px 16px}
.section-h{font-size:13px;text-transform:uppercase;letter-spacing:.3px;color:var(--label2);padding:18px 20px 6px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--blur);-webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 4px calc(6px + var(--sab))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--label2);font-size:10.5px;font-weight:500;position:relative;padding:2px 0}
.tabbar button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.active{color:var(--brand)}
.tabbar .dot{position:absolute;top:-1px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* grouped list */
.list{background:var(--card);border-radius:12px;margin:0 16px;overflow:hidden}
.list>.li{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;min-height:48px}
.list>.li+.li::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:.5px solid var(--sep)}
.li .t{font-size:16px} .li .s{font-size:13px;color:var(--label2)}
.chev::after{content:"";width:8px;height:8px;border-right:2px solid var(--label3);border-top:2px solid var(--label3);transform:rotate(45deg);margin-left:4px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin:0 16px 12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:13px 18px;font-weight:600;font-size:16px;background:var(--brand);color:#fff;transition:transform .12s,opacity .12s;min-height:48px}
.btn:active{transform:scale(.97);opacity:.85}
.btn.block{display:flex;width:100%}
.btn.sec{background:var(--fill);color:var(--brand)} .btn.blue{background:var(--blue)} .btn.green{background:var(--green)}
.btn.red{background:rgba(255,59,48,.12);color:var(--red)} .btn.sm{padding:8px 14px;font-size:14px;min-height:36px;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.iconbtn{width:36px;height:36px;border-radius:18px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--label)}

/* inputs */
.field{display:block;margin:0 0 10px}
.field>span{display:block;font-size:13px;color:var(--label2);margin:0 4px 5px}
.inp,textarea.inp,select.inp{width:100%;background:var(--fill);border:0;border-radius:10px;padding:12px 14px;font-size:16px;outline:none;min-height:46px;appearance:none;-webkit-appearance:none}
.inp:focus{box-shadow:0 0 0 2px var(--blue) inset}
textarea.inp{resize:none;min-height:70px}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:0 12px;height:40px}
.search input{flex:1;background:none;border:0;outline:none;font-size:16px;min-width:0}
.search svg{width:18px;height:18px;stroke:var(--label2);fill:none;stroke-width:2}

/* segmented control */
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;padding:7px 8px;border-radius:8px;font-size:14px;font-weight:600;color:var(--label);white-space:nowrap}
.seg button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){.seg button.on{background:#636366}}

/* switch */
.sw{position:relative;width:51px;height:31px;flex:none;display:inline-block}
.sw input{display:none}
.sw i{position:absolute;inset:0;background:var(--fill2);border-radius:16px;transition:.25s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:.25s}
.sw input:checked+i{background:var(--green)} .sw input:checked+i::after{transform:translateX(20px)}

/* pills / chips / badges */
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--fill);color:var(--label2);white-space:nowrap}
.pill.green{background:rgba(52,199,89,.15);color:#1f9d44} .pill.orange{background:rgba(255,149,0,.16);color:#c76e00}
.pill.red{background:rgba(255,59,48,.14);color:var(--red)} .pill.blue{background:rgba(0,122,255,.13);color:var(--blue)}
@media (prefers-color-scheme:dark){.pill.green{color:#30D158}.pill.orange{color:#FF9F0A}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--brand);color:#fff}

/* bottom sheet */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.4);animation:bd .2s ease}
@keyframes bd{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:560px;max-height:92vh;background:var(--bg);border-radius:16px 16px 0 0;display:flex;flex-direction:column;animation:up .3s cubic-bezier(.2,.9,.3,1)}
.sheet.full{height:92vh}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--label3);margin:7px auto 2px;flex:none}
.sheet .sh-head{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px;flex:none}
.sheet .sh-head h3{font-size:18px;font-weight:700}
.sheet .sh-body{overflow-y:auto;padding:4px 0 16px;flex:1;-webkit-overflow-scrolling:touch}
.sheet .sh-foot{padding:10px 16px calc(12px + var(--sab));background:var(--blur);border-top:.5px solid var(--sep);flex:none}
.alert-wrap{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);padding:30px}
.alert{width:100%;max-width:290px;background:var(--card);border-radius:14px;text-align:center;overflow:hidden;animation:pop .2s ease}
@keyframes pop{from{transform:scale(1.1);opacity:0}to{transform:none;opacity:1}}
.alert .msg{padding:18px 16px;font-size:15px}
.alert .acts{display:flex;border-top:.5px solid var(--sep)}
.alert .acts button{flex:1;padding:13px;font-size:17px;color:var(--blue)} .alert .acts button+button{border-left:.5px solid var(--sep);font-weight:600}
.alert .acts button.danger{color:var(--red)}

/* toast */
#toasts{position:fixed;left:0;right:0;top:calc(10px + var(--sat));z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:rgba(40,40,42,.94);color:#fff;padding:11px 18px;border-radius:24px;font-size:15px;font-weight:500;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .35s cubic-bezier(.2,1.2,.3,1)}
.toast.err{background:rgba(255,59,48,.96)} .toast.ok{background:rgba(36,160,70,.96)}
@keyframes tin{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}

.empty{text-align:center;padding:50px 30px;color:var(--label2)} .empty .big{font-size:54px;margin-bottom:8px}
.spin{width:26px;height:26px;border:3px solid var(--fill2);border-top-color:var(--brand);border-radius:50%;animation:rot .8s linear infinite;margin:40px auto}
@keyframes rot{to{transform:rotate(360deg)}}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 24px;max-width:420px;margin:0 auto}
.login img.logo{width:120px;margin:0 auto 14px;display:block}
.login h1{text-align:center;font-size:28px;letter-spacing:-.4px}
.login p.sub{text-align:center;color:var(--label2);margin:4px 0 24px}
.err-txt{color:var(--red);font-size:14px;text-align:center;min-height:20px;margin-top:10px}

/* order cards (staff) */
.ocard{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin:0 16px 12px;border-left:5px solid var(--orange)}
.ocard.st-accepted,.ocard.st-preparing{border-left-color:var(--blue)}
.ocard.st-ready,.ocard.st-out_for_delivery{border-left-color:#AF52DE}
.ocard.st-completed{border-left-color:var(--green)} .ocard.st-cancelled{border-left-color:var(--label3);opacity:.7}
.ocard .items{margin:10px 0;padding:10px 12px;background:var(--card2);border-radius:10px;font-size:15px}
.ocard .items div{display:flex;gap:8px;padding:2px 0}
.ocard .items b{min-width:26px}
.ocard .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ocard .acts .btn{flex:1;min-width:110px}
.newflash{animation:flash 1.2s ease 3}
@keyframes flash{50%{box-shadow:0 0 0 4px rgba(255,59,48,.35)}}
.fab{position:fixed;right:16px;bottom:calc(76px + var(--sab));z-index:35;background:var(--brand);color:#fff;border-radius:28px;padding:0 20px;height:54px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(91,108,224,.35)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.tile{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.tile .v{font-size:26px;font-weight:700;letter-spacing:-.5px} .tile .l{font-size:13px;color:var(--label2)}

@media print{
  body *{visibility:hidden} #print-area,#print-area *{visibility:visible}
  #print-area{position:absolute;left:0;top:0;width:80mm}
}
#print-area{display:none}
@media print{#print-area{display:block!important}}
</style>
<style>.chart{padding:6px 4px 0}
.chart text{fill:var(--label2);font-size:10px;font-family:var(--font)}
.chart .bar{fill:var(--brand)} .chart .bar2{fill:#5AC8FA} .chart .today{opacity:1} .chart .old{opacity:.8}
.ico{display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff;box-shadow:inset 0 -1px 0 rgba(0,0,0,.08)} .ico svg{stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tile .l{display:flex;align-items:center;gap:8px} .tile .v{margin-top:8px}
.section-h{display:flex;align-items:center;gap:8px}
.card{border-radius:18px}
.cv{width:20px;height:20px;flex:none;stroke:var(--label3);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s} .cv.open{transform:rotate(90deg)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--label3,#C7C7CC);flex:none;display:flex;align-items:center;justify-content:center}.chk.on{background:#007AFF;border-color:#007AFF}.chk.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.av{width:38px;height:38px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.cseg{display:flex;background:rgba(120,120,128,.16);border-radius:9px;padding:2px;gap:2px}.cseg button{flex:1;padding:7px 0;border-radius:7px;font-weight:600;font-size:14px;color:inherit}.cseg button.on{background:#fff;color:#000;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.cchip{padding:7px 13px;border-radius:16px;background:rgba(120,120,128,.14);font-size:13px;font-weight:600;color:inherit}
.tabbar button{min-width:0;font-size:10px}
.rank{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:15px}
.rank+.rank{border-top:.5px solid var(--sep)}
.rank .n{width:22px;height:22px;border-radius:50%;background:var(--fill);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.pr{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--card);border-bottom:.5px solid var(--sep)}
.pos-line{display:flex;align-items:center;gap:10px;padding:10px 16px}
.pos-line+.pos-line{border-top:.5px solid var(--sep)}
.mini{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px}
.mini button{width:32px;height:32px;font-size:18px;font-weight:700}
.mini span{min-width:18px;text-align:center;font-weight:700}
.billfoot{position:sticky;bottom:calc(60px + var(--sab));z-index:20;padding:10px 16px;background:var(--blur);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:.5px solid var(--sep)}
.navbar .billfoot{position:static;padding:8px 0 0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;border:0}
.cg{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--label2);padding:14px 20px 6px;background:var(--bg)}
.receipt{font:13px/1.35 'Courier New',monospace;color:#000;background:#fff;padding:10px;width:100%}
.receipt table{width:100%;border-collapse:collapse} .receipt td,.receipt th{padding:2px 0;text-align:left} .receipt th:last-child,.receipt td:last-child{text-align:right}

<style id="sone-theme">/* Sone calm iOS theme: Apple system colors, flat, soft, easy on the eyes */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F9F9FB; --sep:rgba(60,60,67,.14);
  --brand:#5B6CE0; --brand-d:#4655C7; --gold:#8E8E93;
  --shadow:0 0 0 .5px rgba(60,60,67,.08);
  --grad:linear-gradient(135deg,#7F8CF5,#5B6CE0);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --sep:rgba(84,84,88,.55);
  --brand:#8590FF; --brand-d:#6E79F0; --gold:#98989D;
  --shadow:0 0 0 .5px rgba(255,255,255,.06);
  --grad:linear-gradient(135deg,#8E99FF,#6571E8);
}}
body{letter-spacing:0}
h1,h2,h3,.largetitle{letter-spacing:-.4px}
.largetitle{font-weight:700}
.navbar{border-bottom:.5px solid var(--sep);box-shadow:none}
.section-h{font-weight:600;letter-spacing:.3px;color:var(--label2);text-transform:uppercase;font-size:13px}
.list{border-radius:12px;box-shadow:none}
.list>.li+.li{border-top:.5px solid var(--sep)}
.card,.ocard,.tile{border-radius:14px;box-shadow:none;border:0}
.btn{background:var(--brand);border-radius:12px;box-shadow:none;letter-spacing:0}
.btn.sec{background:var(--fill);color:var(--brand)}
.btn.green{background:var(--green)}
.btn.blue{background:var(--blue)}
.btn.red{background:rgba(255,59,48,.12);color:var(--red)}
.chip{border:0;box-shadow:none;background:var(--card)}
.chip.on{background:var(--brand);color:#fff;box-shadow:none}
.tabbar{border-top:.5px solid var(--sep);box-shadow:none}
.tabbar button.active{color:var(--brand);font-weight:600}
.tabbar button.active::before{content:none}
.inp:focus,input:focus,textarea:focus,select:focus{outline:2px solid rgba(0,122,255,.45);outline-offset:0}
.sheet{border-radius:14px 14px 0 0}
.alert{border-radius:14px}
.toast{border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.fab{background:var(--brand);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tile .v{font-weight:700;letter-spacing:-.4px}
.hero .b{border-radius:16px;box-shadow:none}
.hero .b .go{background:#fff;color:#000}
.cartbar{background:var(--green);border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.dot{box-shadow:none}
#langbar,#install-box{border:0;box-shadow:none;border-radius:14px}
#langbar button{border-radius:10px}
#langbar button.on{background:var(--brand)!important;box-shadow:none}
.view:not(#v-more) #langbar,.view:not(#v-more) #install-box,#app>#langbar,#app>#install-box,body>#langbar,body>#install-box{display:none!important}
#install-btn{background:var(--brand)!important;box-shadow:none;border-radius:12px}
</style>
<style>/* Sone - iOS polish v2 */
:root{--r-card:20px;--r-btn:14px}
body{letter-spacing:-.01em;text-rendering:optimizeLegibility}
.navbar{border-bottom:.5px solid var(--sep);background:var(--blur);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.largetitle{font-size:34px;letter-spacing:-.8px;padding:10px 20px 6px}
.card,.tile,.ocard{border-radius:var(--r-card);box-shadow:0 0 0 .5px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04),0 12px 28px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){.card,.tile,.ocard{box-shadow:0 0 0 .5px rgba(255,255,255,.07)}}
.tile{padding:16px;transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile .v{font-size:28px;font-weight:700;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.list{border-radius:16px;box-shadow:0 0 0 .5px rgba(0,0,0,.04)}
.list>.li{min-height:52px}
.list>.li+.li::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:.5px solid var(--sep)}
.btn{border-radius:var(--r-btn);letter-spacing:-.2px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn:active{transform:scale(.97);opacity:.9}
.btn.sec,.btn.red{box-shadow:none}
.chip{padding:8px 16px;box-shadow:0 0 0 .5px rgba(0,0,0,.06);transition:background .15s,transform .15s}
.chip:active{transform:scale(.96)}
.sheet{border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet .sh-head h3{font-size:20px;letter-spacing:-.4px}
.sheet-wrap{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.tabbar{padding-top:7px}
.tabbar button{transition:color .15s,transform .15s}
.tabbar button:active{transform:scale(.92)}
.tabbar button.active svg{stroke-width:2}
.ocard{border-left-width:0;padding:16px;position:relative;overflow:hidden}
.ocard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--orange)}
.ocard.st-accepted::before,.ocard.st-preparing::before{background:var(--blue)}
.ocard.st-ready::before,.ocard.st-out_for_delivery::before{background:#AF52DE}
.ocard.st-completed::before{background:var(--green)}
.ocard.st-cancelled::before{background:var(--label3)}
.ocard .items{border-radius:14px}
.pill{padding:4px 10px;letter-spacing:0}
.fab{box-shadow:0 10px 30px rgba(91,108,224,.4);backdrop-filter:blur(8px)}
.inp,input.inp,select.inp,textarea.inp{border-radius:12px}
.inp:focus{outline:none;box-shadow:0 0 0 3px rgba(91,108,224,.28)}
.toast{backdrop-filter:blur(12px);border-radius:26px}
.chart svg{cursor:pointer}
</style>

<script>/* Sone live map: Google Maps (if key set) else Leaflet + OSM. Rider + customer pins + route + ETA */

    return gKey;
  }
  const hav = (a, b, c, d) => { const r = x => x * Math.PI / 180, h = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2; return 12742 * Math.asin(Math.sqrt(h)); };

    let v = null;
    try { const ctl = new AbortController(); setTimeout(() => ctl.abort(), 6000); const r = await fetch('https://router.project-osrm.org/route/v1/driving/' + a.lng + ',' + a.lat + ';' + b.lng + ',' + b.lat + '?overview=full&geometries=geojson', { signal: ctl.signal }); const j = await r.json(); const t = j.routes && j.routes[0]; if (t) v = { coords: t.geometry.coordinates.map(x => [x[1], x[0]]), km: t.distance / 1000, min: Math.max(1, Math.round(t.duration / 60)) }; } catch (e) {}
    if (!v) { const km = hav(a.lat, a.lng, b.lat, b.lng) * 1.3; v = { coords: [[a.lat, a.lng], [b.lat, b.lng]], km, min: Math.max(1, Math.round(km / 20 * 60)) }; }

  }
  const EMO = { rider: '🛵', home: '🏠', shop: '🍽️' };
  const LL = {
    map: { urls: [['https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }]] },
    sat: { urls: [['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Esri, Maxar, Earthstar' }], ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }]] },
    ter: { urls: [['https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { subdomains: 'abc', maxZoom: 17, attribution: '© OpenTopoMap © OpenStreetMap' }]] }
  };
  function leafletEngine(el) {
    const map = L.map(el, { zoomControl: false }).setView([25.55, 84.15], 13), marks = {}, lines = {}; let tiles = [], meM = null;
    return {
      layers: { map: 'Map', sat: 'Satellite', ter: 'Terrain' },
      setLayer(k) { tiles.forEach(t => map.removeLayer(t)); tiles = LL[k].urls.map(u => L.tileLayer(u[0], u[1]).addTo(map)); },
      put(id, p) { const ll = [p.lat, p.lng], kd = p.kind || 'rider'; if (marks[id]) { marks[id].setLatLng(ll); if (marks[id].setTooltipContent) marks[id].setTooltipContent(esc(p.label || '')); } else { marks[id] = L.marker(ll, { icon: L.divIcon({ html: '<div class="sm-ico ' + kd + '">' + EMO[kd] + '</div>', className: 'sm-pin', iconSize: [38, 38], iconAnchor: [19, 19] }) }); if (p.label) marks[id].bindTooltip(esc(p.label), { permanent: true, direction: 'top', offset: [0, -22], className: 'sm-tip' }); marks[id].addTo(map); } },
      drop(id) { if (marks[id]) { map.removeLayer(marks[id]); delete marks[id]; } },
      line(id, coords) { if (lines[id]) { map.removeLayer(lines[id]); delete lines[id]; } if (coords) lines[id] = L.polyline(coords, { color: '#1a73e8', weight: 5, opacity: .85 }).addTo(map); },
      fit(pts) { if (pts.length === 1) map.setView([pts[0].lat, pts[0].lng], Math.max(map.getZoom ? map.getZoom() : 16, 16)); else if (pts.length) map.fitBounds(L.latLngBounds(pts.map(p => [p.lat, p.lng])), { padding: [50, 50] }); },
      pan(p) { map.panTo([p.lat, p.lng]); }, onDrag(cb) { map.on('dragstart', cb); },
      me(lat, lng, zoom) { if (zoom) map.setView([lat, lng], 16); else if (meM) meM.setLatLng([lat, lng]); else meM = L.marker([lat, lng], { icon: L.divIcon({ html: '<div class="sm-me"></div>', className: 'sm-pin', iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(map); },

  function googleEngine(el) {

    const bd = { rider: '#1a73e8', home: '#D62828', shop: '#FF9500' };
    return {
      layers: { map: 'Map', sat: 'Satellite', ter: 'Terrain', trf: 'Traffic' },
      setLayer(k) { if (k === 'trf') { traffic.getMap() ? traffic.setMap(null) : traffic.setMap(map); return 'toggle'; } map.setMapTypeId({ map: 'roadmap', sat: 'hybrid', ter: 'terrain' }[k]); },
      put(id, p) { const ll = { lat: p.lat, lng: p.lng }, kd = p.kind || 'rider'; if (marks[id]) { marks[id].m.setPosition(ll); if (marks[id].w) marks[id].w.setContent(esc(p.label || '')); } else { const m = new google.maps.Marker({ position: ll, map, icon: { path: google.maps.SymbolPath.CIRCLE, scale: 19, fillColor: '#ffffff', fillOpacity: 1, strokeColor: bd[kd], strokeWeight: 3 }, label: { text: EMO[kd], fontSize: '20px' }, zIndex: 9 }); let w = null; if (p.label) { w = new google.maps.InfoWindow({ content: esc(p.label), disableAutoPan: true }); w.open(map, m); } marks[id] = { m, w }; } },
      drop(id) { if (marks[id]) { if (marks[id].w) marks[id].w.close(); marks[id].m.setMap(null); delete marks[id]; } },
      line(id, coords) { if (lines[id]) { lines[id].setMap(null); delete lines[id]; } if (coords) lines[id] = new google.maps.Polyline({ path: coords.map(c => ({ lat: c[0], lng: c[1] })), strokeColor: '#1a73e8', strokeWeight: 5, strokeOpacity: .85, map }); },
      fit(pts) { if (pts.length === 1) { map.setCenter({ lat: pts[0].lat, lng: pts[0].lng }); map.setZoom(Math.max(map.getZoom() || 16, 16)); } else if (pts.length) { const b = new google.maps.LatLngBounds(); pts.forEach(p => b.extend({ lat: p.lat, lng: p.lng })); map.fitBounds(b, 60); } },
      pan(p) { map.panTo({ lat: p.lat, lng: p.lng }); }, onDrag(cb) { map.addListener('dragstart', cb); },
      me(lat, lng, zoom) { const ll = { lat, lng }; if (zoom) { map.setCenter(ll); map.setZoom(16); } else if (meM) meM.setPosition(ll); else meM = new google.maps.Marker({ position: ll, map, icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: '#1a73e8', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 3 } }); },
      resize() { google.maps.event.trigger(map, 'resize'); }, destroy() {}
    };
  }
  /* o: {title, fetch(), every, fullscreen, panel(html), onTick(state, root), dest:{lat,lng,label}, origin:{lat,lng,label}} ; fetch points may carry p.dest */
  async function open(o) {
    let timer = null, E = null, dead = false, follow = true, first = true, cur = [], meWatch = null, layer = 'map', busy = false;
    const ids = new Set(), fs = !!o.fullscreen;
    const stop = () => { dead = true; clearInterval(timer); try { meWatch != null && navigator.geolocation.clearWatch(meWatch); } catch (e) {} try { E && E.destroy(); } catch (e) {} };
    const mapH = fs ? '52vh' : '66vh';
    const sh = sheet((fs ? '' : `<div class="sh-head"><h3>${esc(o.title)}</h3><button class="iconbtn" data-close>✕</button></div>`) + `<div class="sh-body" style="padding:0"><div class="sm-wrap ${fs ? 'fs' : ''}"><div id="sm-map" style="height:${mapH}"><div class="spin"></div></div>

    E.setLayer('map');

    E.onDrag(() => { follow = false; });
    const fit = () => { follow = true; E.fit(cur); };
    $('#sm-fit', sh.el).onclick = fit;
    $('#sm-me', sh.el).onclick = () => {
      if (!navigator.geolocation) return;
      if (meWatch == null) meWatch = navigator.geolocation.watchPosition(p => E.me(p.coords.latitude, p.coords.longitude, false), () => toast(T('Location ki permission chahiye'), 'err'), { enableHighAccuracy: true });
      navigator.geolocation.getCurrentPosition(p => { follow = false; E.me(p.coords.latitude, p.coords.longitude, true); }, () => toast(T('Location ki permission chahiye'), 'err'));
    };

        const newest = pts.length ? Math.max(...pts.map(p => new Date(p.at).getTime() || 0)) : 0, sec = newest ? Math.max(0, Math.round((Date.now() - newest) / 1000)) : null;
        const info = $('#sm-info', sh.el);

    }

  }
  return { open };
})();

<script>/* Sone - shared helpers (teeno apps) */
(function () {
  const C = window.SONE_CONFIG;
  window.sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  window.$ = (s, r = document) => r.querySelector(s);
  window.$$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  window.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  window.money = n => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
  window.ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  window.ago = iso => {
    const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return TT_('abhi'); if (s < 3600) return Math.floor(s / 60) + ' ' + TT_('min pehle');
    if (s < 86400) return Math.floor(s / 3600) + ' ' + TT_('ghante pehle');
    return new Date(iso).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
  };
  window.fmtTime = iso => new Date(iso).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  window.fmtDT = iso => new Date(iso).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  window.dayStr = (d = new Date()) => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
  window.startOfDay = (str) => new Date(str + 'T00:00:00');

  /* toast */
  let tbox; window.toast = (msg, type) => {

    setTimeout(() => { t.style.transition = '.3s'; t.style.opacity = 0; setTimeout(() => t.remove(), 300); }, 3200);
  };
  window.haptic = (p = 15) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  /* sound (user ke pehle tap ke baad chalta hai) */

  ['click', 'touchstart', 'keydown'].forEach(e => document.addEventListener(e, unlock, { passive: true }));
  window.chime = (times = 2) => {
    if (ls.get('sone_mute', false)) return; unlock(); if (!actx) return;
    for (let i = 0; i < times; i++) [880, 1175].forEach((f, j) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * .55 + j * .18;
      o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.35, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + .45);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + .5);
    });
  };

    if (ls.get('sone_mute', false) || !('speechSynthesis' in window)) return;

      <label class="field"><span>Email</span><input class="inp" id="lg-email" type="email" autocomplete="username" inputmode="email"></label>
      <label class="field"><span>Password</span><input class="inp" id="lg-pass" type="password" autocomplete="current-password"></label>
      <button class="btn block mt8" id="lg-btn">Login</button>${roles.join() === 'owner' ? '<button class="btn sec block mt8" id="lg-reg" type="button">Naya Owner Register karein</button>' : ''}<div class="err-txt" id="lg-err"></div></div>`;
    const err = m => { $('#lg-err').textContent = m || ''; };
    async function enter(user) {
      const { data, error } = await sb.from('staff').select('*').eq('id', user.id).maybeSingle();
      if (error || !data || !data.active) { await sb.auth.signOut(); box.classList.remove('hide'); $('#app').classList.add('hide'); return err('Is account ko access nahi hai. Owner se baat karein.'); }
      if (!roles.includes(data.role)) { await sb.auth.signOut(); box.classList.remove('hide'); $('#app').classList.add('hide'); return err(window.TT_(data.role === 'owner' ? 'Owner apni Owner app se login karein.' : 'Ye app is account ke liye nahi hai.')); }
      S.me = data; box.classList.add('hide'); $('#app').classList.remove('hide'); onReady(data);
    }
    async function login() {
      const email = $('#lg-email').value.trim(), password = $('#lg-pass').value;
      if (!email || !password) return err('Email aur password likhein');
      $('#lg-btn').disabled = true; err('Login ho raha hai...');
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      $('#lg-btn').disabled = false;
      if (error) return err('Login nahi hua: ' + (/invalid/i.test(error.message) ? 'email ya password galat hai' : error.message));
      err(''); enter(data.user);
    }
    $('#lg-btn').onclick = login; $('#lg-pass').addEventListener('keydown', e => e.key === 'Enter' && login());
    const rb = $('#lg-reg'); if (rb) rb.onclick = () => {
      const logo = $('img.logo', box).src;
      box.innerHTML = `<div class="login"><img class="logo" src="${logo}" alt="Sone"><h1>Owner Register</h1><p class="sub">Pehli baar restaurant ka owner account banayein</p>
        <label class="field"><span>Aapka naam</span><input class="inp" id="rg-name"></label>
        <label class="field"><span>Email</span><input class="inp" id="rg-email" type="email" autocomplete="username" inputmode="email" autocapitalize="off"></label>
        <label class="field"><span>Password (6+ akshar)</span><input class="inp" id="rg-pass" type="password" autocomplete="new-password"></label>
        <label class="field"><span>Password dobara</span><input class="inp" id="rg-pass2" type="password" autocomplete="new-password"></label>
        <button class="btn block mt8" id="rg-btn">Register karein</button><button class="btn sec block mt8" id="rg-back" type="button">← Login par wapas</button><div class="err-txt" id="lg-err"></div></div>`;
      $('#rg-back').onclick = () => location.reload();
      $('#rg-btn').onclick = async () => {
        const name = $('#rg-name').value.trim(), email = $('#rg-email').value.trim(), password = $('#rg-pass').value;
        if (!name) return err('Naam likhein'); if (!/^\S+@\S+\.\S+$/.test(email)) return err('Sahi email likhein');
        if (password.length < 6) return err('Password kam se kam 6 akshar ka rakhein'); if (password !== $('#rg-pass2').value) return err('Dono password same likhein');
        const btn = $('#rg-btn'); btn.disabled = true; err('Register ho raha hai...');
        const fail = m => { btn.disabled = false; err(m); };
        let { data, error } = await sb.auth.signUp({ email, password });
        if (error && !/registered|already/i.test(error.message)) return fail(error.message);
        if (!data || !data.session) {
          const r = await sb.auth.signInWithPassword({ email, password });
          if (r.error) return fail(/confirm/i.test(r.error.message) ? 'Email confirm karein (inbox dekhein), phir yahin Register dobara dabayein' : 'Ye email pehle se hai. Sahi password likhein ya Login karein');
        }
        const { error: e2 } = await sb.rpc('register_first_owner', { p_name: name });
        if (e2) { await sb.auth.signOut(); return fail(/pehle se/i.test(e2.message) ? 'Owner pehle se registered hai. Login karein.' : /function|schema cache|could not find/i.test(e2.message) ? 'Setup baaki hai: owner_register.sql ko Supabase SQL Editor mein ek baar run karein' : e2.message); }
        const { data: { user } } = await sb.auth.getUser(); err(''); enter(user);
      };
    };
    const { data: { session } } = await sb.auth.getSession();
    if (session) enter(session.user); else { box.classList.remove('hide'); $('#app').classList.add('hide'); }
  };
  S.logout = async () => { await sb.auth.signOut(); location.reload(); };

  /* ---------- live orders ---------- */
  S.refresh = async function () {
    if (!S.me) return;
    const from = S.fromDate || new Date(Date.now() - 36 * 3600e3).toISOString();
    const { data, error } = await sb.from('orders').select('*').gte('created_at', from).order('created_at', { ascending: false }).limit(500);
    if (error) { toast('Orders load nahi hue: ' + error.message, 'err'); return; }
    S.orders = data || [];
    const fresh = [];
    if (S.seen) S.orders.forEach(o => { if (!S.seen.has(o.id) && o.status === 'placed' && o.source === 'customer') fresh.push(o); });
    S.seen = new Set(S.orders.map(o => o.id));
    if (fresh.length) {
      chime(3); haptic([250, 120, 250]);
      toast('🔔 Naya order: ' + fresh[0].customer_name + ' · ' + money(fresh[0].total), 'ok');
      speak('Naya order aaya hai');
      S.notify(window.SONE_TR ? SONE_TR('🔔 Naya order · Sone') : '🔔 Naya order · Sone', fresh[0].customer_name + ' · ' + money(fresh[0].total) + (fresh.length > 1 ? ' (+' + (fresh.length - 1) + ' aur)' : ''));
    }
    S.onOrders && S.onOrders(S.orders, fresh);
  };
  S.startLive = function () {
    S.refresh(); S.ensureNames(); S.askNotifyPermission();
    let t; const deb = () => { clearTimeout(t); t = setTimeout(S.refresh, 400); };
    sb.channel('orders-live').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, deb).subscribe();
    setInterval(S.refresh, 15000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) S.refresh(); });
  };
  S.find = id => S.orders.find(o => o.id === Number(id));

  /* ---------- order card ---------- */
  S.card = function (o, opts = {}) {
    const items = (o.items || []).map(i => `<div><b>${i.qty}×</b><span class="grow">${esc(i.name)}</span><span class="muted">${money(i.price * i.qty)}</span></div>`).join('');
    const where = o.order_type === 'delivery' ? `<a href="https://maps.google.com/?q=${S.addrLL(o) ? S.addrLL(o).lat + ',' + S.addrLL(o).lng : encodeURIComponent(S.addrText(o))}" target="_blank" rel="noopener">📍 ${esc(S.addrText(o))}</a>`
      : o.order_type === 'dine_in' ? `🪑 Table ${esc(o.table_no)}` : '🛍️ Khud lene aayenge';
    const paid = o.payment_status === 'paid';
    const payLine = `${PAY_LABEL[o.payment_method]}${o.utr ? ' · UTR <b>' + esc(o.utr) + '</b>' : ''} <span class="pill ${paid ? 'green' : 'orange'}">${paid ? 'Paid' : o.payment_status === 'refunded' ? 'Refunded' : 'Pending'}</span>`;
    const open = o.status !== 'completed' && o.status !== 'cancelled';
    const nl = nextLabel(o);
    return `<div class="ocard st-${o.status} ${opts.flash ? 'newflash' : ''}" data-oid="${o.id}">
      <div class="row between"><div><b style="font-size:17px">#${esc(o.order_no)}</b> <span class="pill blue">${TYPE_LABEL[o.order_type]}</span></div>
        <span class="xs muted">${fmtTime(o.created_at)} · ${ago(o.created_at)}</span></div>
      <div class="mt8 small"><b>${esc(o.customer_name)}</b>${o.phone && o.phone !== '-' ? ` · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>` : ''}</div>
      <div class="small muted mt8">${where}</div>
      <div class="items">${items}</div>
      ${o.note ? `<div class="small mb8">📝 <i>${esc(o.note)}</i></div>` : ''}
      <div class="row between small"><div>${payLine}</div><b style="font-size:18px">${money(o.total)}</b></div>

  S.kotShare = async function (o) {

    const u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 5000);

  /* ---------- profile: mobile number ---------- */
  S.contactsOf = v => { try { const a = typeof v === 'string' ? JSON.parse(v) : v; return Array.isArray(a) ? a : []; } catch (e) { return []; } };

    const me = S.me, role = me.role === 'owner' ? 'Owner' : 'Waiter';

      <div class="sh-body"><div class="card"><div class="row" style="gap:12px"><div class="av" style="background:#5B6CE0">${esc((me.name || '?').trim().charAt(0).toUpperCase())}</div><div class="grow"><div class="bold" style="font-size:18px">${esc(me.name)}</div><div class="small muted">${role}</div></div></div>
        <label class="field mt12"><span>Mera mobile number (10 digit)</span><input class="inp" id="pf-ph" type="tel" inputmode="numeric" maxlength="10" placeholder="98XXXXXXXX" value="${esc(me.phone || '')}"></label>
        <button class="btn block mt8" id="pf-save">Save karein</button></div>
        <p class="xs muted pad">${me.role === 'owner' ? 'Customer ko kaun sa number dikhana hai, wo More → "Customer ke liye call numbers" mein chunein.' : 'Ye number sirf owner ko dikhta hai. Customer ko dikhana hai ya nahi, owner tay karta hai.'}</p></div>`);

        const { error } = await sb.rpc('set_my_phone', { p_phone: p });
        if (error) return toast(/function|schema|column|find/i.test(error.message) ? 'Pehle Supabase mein migration SQL run karein' : error.message, 'err');
        me.phone = p || null; toast(p ? 'Number save ho gaya ✓' : 'Number hata diya', 'ok'); sh.close();
      } finally { b.disabled = false; }
    };
  };

  /* ---------- staff performance (kaun kitna order / accept / table serve) ---------- */
  S.perfData = async function (fromStr, toStr) {
    await S.ensureNames();
    const { data, error } = await sb.from('orders').select('*').gte('created_at', startOfDay(fromStr).toISOString()).lt('created_at', new Date(startOfDay(toStr).getTime() + 86400e3).toISOString()).limit(5000);
    if (error) throw error;
    const m = {}, g = (id, name) => { const k = id || ('n:' + (name || '?')); return m[k] || (m[k] = { name: name || 'Naam nahi mila', tk: 0, tkA: 0, ac: 0, acA: 0, sv: 0, svA: 0, tables: new Set() }); };
    (data || []).forEach(o => {
      if (o.status === 'cancelled') return; const amt = Number(o.total) || 0;
      if (o.source === 'waiter') { const r = g(o.taken_by || o.handled_by, S.takerName(o)); r.tk++; r.tkA += amt; if (o.status === 'completed') { r.sv++; r.svA += amt; r.tables.add(String(o.table_no)); } }
      else if (o.status !== 'placed') { const r = g(o.accepted_by || o.handled_by, S.acceptorName(o)); r.ac++; r.acA += amt; }
    });
    return Object.values(m).sort((a, b) => (b.tkA + b.acA) - (a.tkA + a.acA));
  };
  S.perfView = function () {
    const today = dayStr(), back = n => dayStr(new Date(Date.now() - n * 86400e3));
    const RANGES = [['Aaj', today, today], ['Kal', back(1), back(1)], ['7 din', back(6), today], ['30 din', back(29), today]]; let ri = 0;
    const sh = sheet(`<div class="sh-head"><h3>Staff ka hisaab</h3><button class="iconbtn" data-close>✕</button></div>
      <div class="chips" id="pf-ch">${RANGES.map((r, i) => `<button class="chip ${i === 0 ? 'on' : ''}" data-i="${i}">${r[0]}</button>`).join('')}</div>
      <div class="sh-body" id="pf-body"><div class="spin"></div></div>`, { full: true });
    const body = $('#pf-body', sh.el);
    const load = async () => {
      body.innerHTML = '<div class="spin"></div>';
      try {
        const rows = await S.perfData(RANGES[ri][1], RANGES[ri][2]);
        if (!rows.length) { body.innerHTML = '<div class="empty"><div class="big">📊</div>Is period mein koi order nahi mila.</div>'; return; }
        const T = rows.reduce((a, r) => ({ tk: a.tk + r.tk, tkA: a.tkA + r.tkA, ac: a.ac + r.ac, acA: a.acA + r.acA }), { tk: 0, tkA: 0, ac: 0, acA: 0 });
        const cols = ['#5B6CE0', '#34C759', '#FF9500', '#AF52DE', '#007AFF', '#FF2D55'];
        body.innerHTML = `<div class="tiles"><div class="tile"><div class="l">Table orders liye</div><div class="v">${T.tk}</div><div class="xs muted">${money(T.tkA)}</div></div>
          <div class="tile"><div class="l">Online accept kiye</div><div class="v">${T.ac}</div><div class="xs muted">${money(T.acA)}</div></div></div>` +
          rows.map((r, i) => `<div class="card mt12"><div class="row" style="gap:12px"><div class="av" style="background:${cols[i % cols.length]}">${esc((r.name || '?').trim().charAt(0).toUpperCase())}</div><div class="grow"><div class="bold" style="font-size:17px">${esc(r.name)}</div></div><b>${money(r.tkA + r.acA)}</b></div>

              <div class="li"><span class="grow t">✅ Table serve kiye</span><span><b>${r.tables.size}</b> ${TT_('Table')} · ${r.sv} ${TT_('Order')} · ${money(r.svA)}</span></div></div></div>`).join('') +
          '<p class="xs muted" style="text-align:center;padding:14px 24px">Cancelled/reject orders count nahi hote.</p>';
      } catch (e) { body.innerHTML = '<div class="empty">Hisaab load nahi hua: ' + esc(e.message || e) + '</div>'; }
    };
    $('#pf-ch', sh.el).onclick = e => { const b = e.target.closest('[data-i]'); if (!b) return; ri = +b.dataset.i; $$('#pf-ch .chip', sh.el).forEach(x => x.classList.toggle('on', x === b)); load(); };
    load();
  };

  /* ---------- waiter takes a table order ---------- */
  S.loadMenu = async function () {
    if (S.menu.length) return S.menu;

  S.takeOrder = async function () {
    await S.loadMenu();
    const cart = {}; let q = '';
    const sh = sheet(`<div class="sh-head"><h3>Table ka order</h3><button class="iconbtn" data-close>✕</button></div>
      <div class="pad" style="padding-top:0"><div class="row gap8"><input class="inp" id="to-table" placeholder="Table no." style="max-width:110px" inputmode="text"><div class="search grow">${ICON.search}<input id="to-q" placeholder="Dish dhoondhein"></div></div></div>
      <div class="sh-body" id="to-list"></div>

    const list = $('#to-list', sh.el);
    const total = () => Object.entries(cart).reduce((s, [id, n]) => s + n * S.menu.find(m => m.id == id).price, 0);
    const count = () => Object.values(cart).reduce((s, n) => s + n, 0);
    function render() {
      const m = S.menu.filter(i => !q || i.name.toLowerCase().includes(q)).slice(0, 80);
      list.innerHTML = `<div class="list">${m.map(i => `<div class="li"><div class="grow"><div class="t">${esc(i.name)}</div><div class="s">${money(i.price)} · ${esc(i.category)}</div></div>

      $('#to-go', sh.el).textContent = count() ? `Order bhejein · ${count()} items · ${money(total())}` : 'Order bhejein';
    }
    list.onclick = e => { const a = e.target.closest('[data-a]'), d = e.target.closest('[data-d]');
      if (a) cart[a.dataset.a] = (cart[a.dataset.a] || 0) + 1; if (d) { cart[d.dataset.d]--; if (cart[d.dataset.d] <= 0) delete cart[d.dataset.d]; } if (a || d) { haptic(8); const y = list.scrollTop; render(); list.scrollTop = y; } };
    $('#to-q', sh.el).oninput = e => { q = e.target.value.toLowerCase(); render(); };
    $('#to-go', sh.el).onclick = async () => {
      const table = $('#to-table', sh.el).value.trim(); if (!table) return toast('Table number likhein', 'err'); if (!count()) return toast('Koi dish chunein', 'err');
      const items = Object.entries(cart).map(([id, n]) => { const m = S.menu.find(x => x.id == id); return { id: m.id, name: m.name, price: Number(m.price), qty: n, veg: m.is_veg }; });
      const t = total();
      const row = { customer_name: 'Table ' + table, phone: '-', order_type: 'dine_in', table_no: table, items, subtotal: t, total: t,
        payment_method: 'counter', status: 'accepted', source: 'waiter', handled_by: S.me.id, note: $('#to-note', sh.el).value.trim() || null };
      row.taken_by = S.me.id; row.taken_by_name = S.me.name;
      let { error } = await sb.from('orders').insert(row);
      if (error && /taken_by|column|schema/i.test(error.message)) { delete row.taken_by; delete row.taken_by_name; ({ error } = await sb.from('orders').insert(row)); }
      if (error) return toast(error.message, 'err');
      sh.close(); toast('Order kitchen ko bhej diya ✓', 'ok'); S.refresh();
    };
    render();
  };
})();

<script>/* Owner app: counter billing (POS) + menu management */
(function () {
  const C = window.SONE_CONFIG;
  $('#ic-s2').innerHTML = ICON.search;
  let MENU = [], loaded = false;
  async function loadMenu(force) {
    if (loaded && !force) return MENU;
    const { data, error } = await sb.from('menu_items').select('*').order('sort').order('id');
    if (error) { toast('Menu load nahi hua: ' + error.message, 'err'); return MENU; }
    MENU = data || []; loaded = true; return MENU;
  }
  window.Owner = window.Owner || {};
  Owner.importMenu = async function () {
    const seed = window.SONE_MENU_SEED || []; if (!seed.length) return toast('Menu data nahi mila', 'err');
    if (!await confirmBox(`${seed.length} items ka poora menu load karein? Jo item pehle se hai uska daam nahi badlega.`, 'Load karein')) return;
    let done = 0;
    for (let i = 0; i < seed.length; i += 50) {
      const { error } = await sb.from('menu_items').upsert(seed.slice(i, i + 50), { onConflict: 'name', ignoreDuplicates: true });
      if (error) return toast('Menu load nahi hua: ' + error.message, 'err'); done += Math.min(50, seed.length - i);
    }
    toast(`${done} items ka menu load ho gaya ✓`, 'ok'); await loadMenu(true); drawMenu(); POSUI.show && POSUI.show();
  };
  const cats = () => [...new Set(MENU.map(m => m.category))];

  /* =============== POS =============== */
  let bill = [], q = '', cat = '';
  const total = () => bill.reduce((a, l) => a + l.price * l.qty, 0);
  const cnt = () => bill.reduce((a, l) => a + l.qty, 0);
  window.POSUI = {
    async show() { await loadMenu(); draw(); }
  };
  const baseName = n => n.replace(/\s*\((Full|Half)\)\s*$/i, '');
  const fullOf = n => MENU.find(m => m.name === n) || MENU.find(m => m.name === n + ' (Full)');
  const halfOf = n => MENU.find(m => m.name === n + ' (Half)');
  const hiddenVariant = m => /\(Half\)\s*$/i.test(m.name) && !!fullOf(baseName(m.name));
  function build() {
    $('#pos-results').innerHTML = `<div class="card" style="margin-top:12px"><div class="row bold" style="font-size:18px;margin-bottom:10px;gap:10px">${IC('search','#007AFF')}Item jodein</div>
      <label class="field"><span>Item ka naam (search karein)</span><input class="inp" id="pa-name" autocomplete="off" placeholder="jaise: Paneer, Roti, Water…"></label><div id="pa-sug"></div>
      <label class="field"><span>Full price (₹)</span><input class="inp" id="pa-price" type="number" inputmode="decimal"></label>
      <label class="field"><span>Quantity — number likhein · Half ke liye H · Full+Half ke liye FH</span><input class="inp" id="pa-qty" value="1" inputmode="text" autocapitalize="characters" autocomplete="off"></label>
      <button class="btn block" id="pa-add">＋ Bill mein jodein</button></div>
      <div class="card"><div class="row bold" style="font-size:18px;margin-bottom:8px;gap:10px">${IC('receipt','#AF52DE')}Current Bill</div><div id="pa-bill"></div></div><div style="height:20px"></div>`;
    const nm = $('#pa-name'), pr = $('#pa-price');
    nm.oninput = () => {
      const q = nm.value.trim().toLowerCase(), ex = q && MENU.find(m => m.available && !hiddenVariant(m) && m.name.toLowerCase() === q);
      if (ex) pr.value = ex.price;
      const l = q ? MENU.filter(m => m.available && !hiddenVariant(m) && m.name.toLowerCase().includes(q)).slice(0, 8) : [];
      $('#pa-sug').innerHTML = l.length && !ex ? `<div class="list" style="margin:0 0 10px">${l.map(m => `<button class="li" data-s="${m.id}" style="width:100%;text-align:left"><span class="grow t">${esc(m.name)}</span><span class="muted">${money(m.price)}</span></button>`).join('')}</div>` : '';
    };
    const add = () => {
      const name = nm.value.trim(), price = parseFloat(pr.value), m = $('#pa-qty').value.trim().toUpperCase().replace(/\s+/g, '').match(/^(\d*)(FH|H)?$/);
      if (!name) return toast('Item ka naam likhein', 'err'); if (isNaN(price) || price <= 0) return toast('Price likhein', 'err');
      if (!m || (!m[1] && !m[2])) return toast('Quantity mein number, H ya FH likhein', 'err');
      const n = m[1] ? parseInt(m[1], 10) : 1, kind = m[2] || ''; if (n < 1 || n > 99) return toast('Quantity 1 se 99 ke beech rakhein', 'err');
      const b = baseName(name), full = fullOf(b), half = halfOf(b), fname = full ? full.name : name;
      const hp = half && full && Math.abs(Number(full.price) - price) < 0.001 ? Number(half.price) : Math.round(price / 2);
      const put = (nme, pc, q) => { const key = nme + '|' + pc, ln = bill.find(l => l.key === key); if (ln) ln.qty += q; else bill.push({ key, name: nme, price: pc, qty: q }); };
      if (kind !== 'H') put(fname, price, n); if (kind) put(b + ' (Half)', hp, n);
      haptic(8); toast('Bill mein jud gaya ✓'); nm.value = ''; pr.value = ''; $('#pa-qty').value = '1'; $('#pa-sug').innerHTML = ''; draw(); nm.focus();
    };
    $('#pa-add').onclick = add; $('#pa-qty').addEventListener('keydown', e => e.key === 'Enter' && add());

      $$('[data-pr]', body).forEach(x => x.onclick = () => billView(data.find(b => b.id == x.dataset.pr)));

        const { error: e } = await sb.from('pos_sales').update({ deleted_at: del ? null : new Date().toISOString() }).eq('id', x.dataset.x); if (e) return toast(e.message, 'err'); load(); });
      $$('[data-pd]', body).forEach(x => x.onclick = async () => { if (!await confirmBox('Is bill ko hamesha ke liye hata dein?', 'Delete', true)) return; const { data: d, error: e } = await sb.from('pos_sales').delete().eq('id', x.dataset.pd).select('id'); if (e) return toast(e.message, 'err'); if (!d || !d.length) return toast('Delete ki permission nahi hai. bill_delete_policy.sql run karein.', 'err'); toast('Bill hamesha ke liye hata diya', 'ok'); load(); });
    }
    $('#h-day', sh.el).onchange = e => { day = e.target.value; load(); };
    $('#h-seg', sh.el).onclick = e => { const b = e.target.closest('[data-d]'); if (!b) return; del = b.dataset.d === '1'; $$('#h-seg button', sh.el).forEach(x => x.classList.toggle('on', x === b)); load(); };
    load();
  };

  /* =============== MENU =============== */
  let mq = '';
  window.MenuUI = { async show() { await loadMenu(true); drawMenu(); } };
  function drawMenu() {
    const l = MENU.filter(m => !mq || m.name.toLowerCase().includes(mq) || m.category.toLowerCase().includes(mq));
    if (!MENU.length) { $('#menu-list').innerHTML = '<div class="empty"><div class="big">🍽️</div>Menu abhi khali hai.<br><button class="btn mt12" id="seed-btn">📥 Poora menu load karein (211 items)</button></div>'; $('#seed-btn').onclick = () => Owner.importMenu(); return; }
    $('#menu-list').innerHTML = `<div class="small muted" style="padding:10px 20px 0">${MENU.length} ${TT_('items')} · ${MENU.filter(m => !m.available).length} ${TT_('khatam')}</div>` +
      ([...new Set(l.map(m => m.category))].map(c => `<div class="cg">${esc(c)}</div><div style="background:var(--card)">${l.filter(m => m.category === c).map(m => `<div class="pr" data-edit="${m.id}" style="${m.available ? '' : 'opacity:.55'}">
        <span style="flex:none;width:14px;height:14px;border:1.6px solid;border-radius:3px;color:${m.is_veg ? '#0f8a3c' : '#c62828'};display:inline-block;position:relative"><i style="position:absolute;inset:2px;border-radius:50%;background:currentColor"></i></span>
        <div class="grow"><div>${esc(m.name)} ${m.bestseller ? '<span class="pill orange">★</span>' : ''}</div><div class="small muted">${money(m.price)}${m.available ? '' : ' · Khatam'}</div></div>
        <label class="sw" onclick="event.stopPropagation()"><input type="checkbox" data-av="${m.id}" ${m.available ? 'checked' : ''}><i></i></label></div>`).join('')}</div>`).join('') || '<div class="empty">Kuch nahi mila</div>') + '<div style="height:20px"></div>';
  }
  $('#menu-q').oninput = e => { mq = e.target.value.trim().toLowerCase(); drawMenu(); };
  $('#menu-list').onclick = e => { if (e.target.closest('.sw')) return; const r = e.target.closest('[data-edit]'); if (r) editSheet(MENU.find(m => m.id == r.dataset.edit)); };
  $('#menu-list').onchange = async e => { const c = e.target.closest('[data-av]'); if (!c) return; const { error } = await sb.from('menu_items').update({ available: c.checked }).eq('id', c.dataset.av);
    if (error) { toast(error.message, 'err'); c.checked = !c.checked; return; } MENU.find(m => m.id == c.dataset.av).available = c.checked; toast(c.checked ? 'Available ✓' : 'Khatam mark kiya'); drawMenu(); };
  $('#menu-add').onclick = () => editSheet(null);

  function editSheet(m) {
    const n = m || { name: '', price: '', category: '', is_veg: true, available: true, bestseller: false, description: '', image_url: '' };
    const sh = sheet(`<div class="sh-head"><h3>${m ? 'Item edit' : 'Naya item'}</h3><button class="iconbtn" data-close>✕</button></div><div class="sh-body"><div class="card">
      <label class="field"><span>Naam</span><input class="inp" id="e-name" value="${esc(n.name)}"></label>
      <div class="row gap8"><label class="field grow"><span>Price ₹</span><input class="inp" id="e-price" type="number" inputmode="decimal" value="${n.price}"></label>
      <label class="field grow"><span>Category</span><input class="inp" id="e-cat" list="e-cats" value="${esc(n.category)}"><datalist id="e-cats">${cats().map(c => `<option value="${esc(c)}">`).join('')}</datalist></label></div>
      <label class="field"><span>Chhota description (optional)</span><input class="inp" id="e-desc" maxlength="120" value="${esc(n.description || '')}"></label>
      <label class="field"><span>Photo ka link (optional, https://…)</span><input class="inp" id="e-img" autocapitalize="off" value="${esc(n.image_url || '')}"></label></div>
      <div class="list"><div class="li"><div class="grow t">🥦 Veg</div><label class="sw"><input type="checkbox" id="e-veg" ${n.is_veg ? 'checked' : ''}><i></i></label></div>
      <div class="li"><div class="grow t">★ Bestseller</div><label class="sw"><input type="checkbox" id="e-bs" ${n.bestseller ? 'checked' : ''}><i></i></label></div>
      <div class="li"><div class="grow t">Available</div><label class="sw"><input type="checkbox" id="e-av" ${n.available ? 'checked' : ''}><i></i></label></div></div>
      ${m ? '<div class="pad"><button class="btn red block" id="e-del">Item delete karein</button></div>' : ''}</div><div class="sh-foot"><button class="btn block" id="e-save">Save karein</button></div>`, { full: true });
    $('#e-save', sh.el).onclick = async () => {
      const name = $('#e-name', sh.el).value.trim(), price = parseFloat($('#e-price', sh.el).value), category = $('#e-cat', sh.el).value.trim() || 'Other', img = $('#e-img', sh.el).value.trim();
      if (!name || isNaN(price) || price < 0) return toast('Naam aur sahi price likhein', 'err');
      if (img && !/^https:\/\//i.test(img)) return toast('Photo ka link https:// se shuru hona chahiye', 'err');
      const row = { name, price, category, is_veg: $('#e-veg', sh.el).checked, bestseller: $('#e-bs', sh.el).checked, available: $('#e-av', sh.el).checked, description: $('#e-desc', sh.el).value.trim() || null, image_url: img || null };
      const r = m ? await sb.from('menu_items').update(row).eq('id', m.id) : await sb.from('menu_items').insert({ ...row, sort: Math.max(0, ...MENU.map(x => x.sort)) + 1 });
      if (r.error) return toast(r.error.code === '23505' ? 'Is naam ka item pehle se hai' : r.error.message, 'err');
      toast('Save ho gaya ✓', 'ok'); sh.close(); await loadMenu(true); drawMenu();
    };
    const d = $('#e-del', sh.el); if (d) d.onclick = async () => { if (!await confirmBox(`"${m.name}" delete karein?`, 'Delete', true)) return; const { error } = await sb.from('menu_items').delete().eq('id', m.id); if (error) return toast(error.message, 'err'); sh.close(); toast('Delete ho gaya'); await loadMenu(true); drawMenu(); };
  }
})();
</script>
<script>/* Owner app: dashboard, online orders, more (settings / staff / udhaar / export) */
(function () {
  const C = window.SONE_CONFIG;
  ['t1:home', 't2:list', 't3:receipt', 't4:fork', 't5:more', 't6:people'].forEach(s => { const [i, n] = s.split(':'); $('#' + i).innerHTML = ICON[n]; });
  $('#today-str').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
  window.Owner = Object.assign(window.Owner || {}, { SET: {}, tab: null });
  let SALES = [];                 // pos_sales (last 7 days)
  let ofilter = 'all';

  function tab(n) {
    $$('.view').forEach(v => v.classList.toggle('active', v.id === 'v-' + n));
    $$('#tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === n));
    scrollTo(0, 0); Owner.tab = n;
    if (n === 'home') renderHome(); if (n === 'orders') renderOrders(Staff.orders); if (n === 'pos') window.POSUI && POSUI.show(); if (n === 'menu') window.MenuUI && MenuUI.show(); if (n === 'more') renderMore(); if (n === 'cust') window.CustUI && CustUI.show();
  }
  window.Owner.goto = tab;
  $('#tabbar').onclick = e => { const b = e.target.closest('button'); if (b) tab(b.dataset.tab); };

  /* ---------- settings ---------- */
  Owner.loadSettings = async () => { const { data } = await sb.from('settings').select('*'); Owner.SET = {}; (data || []).forEach(r => Owner.SET[r.key] = r.value); return Owner.SET; };
  Owner.saveSettings = async obj => {
    const rows = Object.entries(obj).map(([key, value]) => ({ key, value }));
    const { error } = await sb.from('settings').upsert(rows); if (error) { toast(error.message, 'err'); return false; }
    Object.assign(Owner.SET, obj); return true;
  };

  /* ---------- dashboard ---------- */
  async function renderHome() {
    const box = $('#home'); const days = []; for (let i = 6; i >= 0; i--) days.push(dayStr(new Date(Date.now() - i * 86400e3)));
    const [s, u] = await Promise.all([
      sb.from('pos_sales').select('*').gte('bill_date', days[0]).is('deleted_at', null),
      sb.from('pos_sales').select('udhaar').gt('udhaar', 0).is('deleted_at', null)]);
    SALES = s.data || []; const udhaar = (u.data || []).reduce((a, r) => a + Number(r.udhaar), 0);
    const today = days[6], ord = Staff.orders.filter(o => o.status !== 'cancelled');
    const oDay = d => ord.filter(o => dayStr(new Date(o.created_at)) === d), pDay = d => SALES.filter(x => x.bill_date === d);
    const posAmt = x => Number(x.subtotal) - Number(x.discount);
    const per = days.map(d => ({ d, online: oDay(d).reduce((a, o) => a + Number(o.total), 0), pos: pDay(d).reduce((a, x) => a + posAmt(x), 0) }));
    const T = per[6], tOrd = oDay(today), tPos = pDay(today);
    const newN = Staff.orders.filter(o => o.status === 'placed').length, verify = Staff.orders.filter(o => o.payment_method === 'upi' && o.payment_status === 'pending' && o.status !== 'cancelled').length;
    const cash = tPos.reduce((a, x) => a + Number(x.cash), 0) + tOrd.filter(o => o.payment_status === 'paid' && o.payment_method !== 'upi').reduce((a, o) => a + Number(o.total), 0);
    const onl = tPos.reduce((a, x) => a + Number(x.online), 0) + tOrd.filter(o => o.payment_status === 'paid' && o.payment_method === 'upi').reduce((a, o) => a + Number(o.total), 0);
    const top = {}; tOrd.forEach(o => (o.items || []).forEach(i => top[i.name] = (top[i.name] || 0) + i.qty)); tPos.forEach(x => (x.items || []).forEach(i => top[i.name] = (top[i.name] || 0) + i.qty));
    const topL = Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const max = Math.max(1, ...per.map(p => p.online + p.pos)), W = 320, H = 146, bw = 30, gap = (W - 7 * bw) / 8, BASE = 118, MH = 78;
    const fmt = v => v >= 1000 ? '₹' + (Math.round(v / 100) / 10) + 'k' : '₹' + Math.round(v);
    const bars = per.map((p, i) => { const x = gap + i * (bw + gap), tot = p.pos + p.online, ht = tot ? Math.max(3, tot / max * MH) : 0, hp = p.pos ? Math.max(3, p.pos / max * MH) : 0, td = i === 6, dn = new Date(p.d).toLocaleDateString('en-IN', { weekday: 'short' }).slice(0, 3);
      return `<g class="${td ? 'today' : 'old'}">${ht ? `<rect class="bar2" x="${x}" y="${BASE - ht}" width="${bw}" height="${ht}" rx="4"/>` : ''}${hp ? `<rect class="bar" x="${x}" y="${BASE - hp}" width="${bw}" height="${hp}" rx="4"/>` : ''}</g>
        <text x="${x + bw / 2}" y="${BASE + 15}" text-anchor="middle" style="${td ? 'font-weight:700;fill:var(--label)' : ''}">${dn}</text>${tot ? `<text x="${x + bw / 2}" y="${BASE - ht - 5}" text-anchor="middle" style="font-weight:${td ? 700 : 500}">${fmt(tot)}</text>` : `<text x="${x + bw / 2}" y="${BASE - 5}" text-anchor="middle" style="opacity:.5">–</text>`}`; }).join('');
    const on = String(Owner.SET.accepting_orders) !== 'false';
    box.innerHTML = `
      <div class="card" style="margin-top:12px"><div class="row between"><div class="row" style="gap:12px;min-width:0">${IC('globe','#34C759')}<div><div class="bold">Online ordering</div><div class="small muted" id="acc-sub">${on ? 'Customers abhi order kar sakte hain' : 'Band hai — customers order nahi kar sakte'}</div></div>
        </div><label class="sw"><input type="checkbox" id="acc-sw" ${on ? 'checked' : ''}><i></i></label></div></div>
      ${newN || verify ? `<div class="card" style="background:rgba(255,149,0,.12)"><button class="row between" id="go-orders" style="width:100%;text-align:left"><div><div class="bold">${newN ? `🔔 ${newN} naya order` : ''}${newN && verify ? ' · ' : ''}${verify ? `💳 ${verify} UPI payment verify karni hai` : ''}</div><div class="small muted">Dekhne ke liye tap karein</div></div><span class="muted">›</span></button></div>` : ''}
      <div class="section-h" style="padding-top:6px">${IC('rupee','#5B6CE0',20)}Aaj ka hisaab</div>
      <div class="tiles">
        <div class="tile" style="grid-column:span 2;background:var(--brand);color:#fff"><div class="l" style="color:rgba(255,255,255,.85)">${IC('rupee','rgba(255,255,255,.28)',28)}Aaj ki kul sale</div><div class="v">${money(T.online + T.pos)}</div></div>
        <div class="tile"><div class="l">${IC('bag','#30B0C7',28)}Online orders (${tOrd.length})</div><div class="v">${money(T.online)}</div></div>
        <div class="tile"><div class="l">${IC('receipt','#AF52DE',28)}Counter bills (${tPos.length})</div><div class="v">${money(T.pos)}</div></div>
        <div class="tile"><div class="l">${IC('cash','#34C759',28)}Cash mila</div><div class="v">${money(cash)}</div></div>
        <div class="tile"><div class="l">${IC('phone','#007AFF',28)}Online/UPI mila</div><div class="v">${money(onl)}</div></div>
        <div class="tile" style="grid-column:span 2"><div class="l">${IC('book','#5856D6',28)}Total udhaar baaki (sab bills)</div><div class="v" style="color:${udhaar ? 'var(--red)' : 'inherit'}">${money(udhaar)}</div></div>
      </div>
      <div class="section-h">${IC('chart','#007AFF',20)}Pichhle 7 din</div>
      <div class="card chart"><svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="0" x2="${W}" y1="118" y2="118" stroke="var(--sep)"/>${bars}</svg>
        <div class="row gap8 xs muted" style="justify-content:center;padding-bottom:4px"><span style="color:var(--brand)">■</span>Counter <span style="color:var(--blue)">■</span>Online</div></div>
      <div class="list" style="margin-bottom:12px"><button class="li chev" id="go-perf" style="width:100%;text-align:left">${IC('users','#5B6CE0')}<span class="grow t">Staff ka hisaab (order · accept · table)</span></button></div>
      <div class="card" style="padding:0;overflow:hidden"><button class="row between" id="top-t" style="width:100%;text-align:left;padding:14px;gap:10px">
        <div class="row" style="gap:12px;min-width:0">${IC('flame','#FF9500')}<div style="min-width:0"><div class="bold">Aaj ke top dishes</div><div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${topL.length ? '#1 ' + esc(topL[0][0]) : 'Aaj abhi koi sale nahi.'}</div></div></div>
        <svg class="cv ${Owner.topOpen ? 'open' : ''}" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <div id="top-b" class="${Owner.topOpen ? '' : 'hide'}" style="padding:0 14px 8px;border-top:.5px solid var(--sep)">${topL.length ? topL.map((t, i) => `<div class="rank"><span class="n">${i + 1}</span><span class="grow">${esc(t[0])}</span><b>${t[1]}</b></div>`).join('') : '<div class="muted small" style="padding:10px 0">Aaj abhi koi sale nahi.</div>'}</div></div>
      <div style="height:20px"></div>`;
    const sw = $('#acc-sw'); sw.onchange = async () => { const ok = await Owner.saveSettings({ accepting_orders: sw.checked }); if (!ok) sw.checked = !sw.checked; else { toast(sw.checked ? 'Online orders chalu ✓' : 'Online orders band kiye', sw.checked ? 'ok' : ''); $('#acc-sub').textContent = sw.checked ? 'Customers abhi order kar sakte hain' : 'Band hai — customers order nahi kar sakte'; } };
    const gp = $('#go-perf'); if (gp) gp.onclick = () => Staff.perfView();
    const g = $('#go-orders'); if (g) g.onclick = () => tab('orders');
    const csv = $('.chart svg'); if (csv) csv.onclick = e => { const r = csv.getBoundingClientRect(), i = Math.max(0, Math.min(6, Math.floor((e.clientX - r.left) / r.width * W / (W / 7)))); dayDetail(per[i].d, oDay, pDay, posAmt); };
    const tt = $('#top-t'); if (tt) tt.onclick = () => { Owner.topOpen = !Owner.topOpen; $('#top-b').classList.toggle('hide', !Owner.topOpen); tt.querySelector('.cv').classList.toggle('open', Owner.topOpen); };
  }
  function dayDetail(d, oDay, pDay, posAmt) {
    const ol = oDay(d).sort((a, b) => new Date(b.created_at) - new Date(a.created_at)), pl = pDay(d).sort((a, b) => b.bill_no - a.bill_no);
    const oT = ol.reduce((a, o) => a + Number(o.total), 0), pT = pl.reduce((a, x) => a + posAmt(x), 0);
    const nice = new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' });
    const sh = sheet(`<div class="sh-head"><div><h3>${esc(nice)}</h3><div class="small muted">Kul ${money(oT + pT)}</div></div><button class="iconbtn" data-close>✕</button></div>
      <div class="sh-body">${!ol.length && !pl.length ? '<div class="empty"><div class="big">🧾</div>Is din koi bill ya order nahi.</div>' : ''}

      ${ol.length ? `<div class="section-h">Online / Table orders (${ol.length}) · ${money(oT)}</div><div class="list">${ol.map(o => `<div class="li"><div class="grow"><div class="t bold">#${esc(o.order_no)} · ${esc(o.customer_name)}</div><div class="xs muted">${fmtTime(o.created_at)} · ${TYPE_LABEL[o.order_type]}${o.table_no ? ' · Table ' + esc(o.table_no) : ''} · ${esc(STATUS_LABEL[o.status] || o.status)}</div></div><b>${money(o.total)}</b></div>`).join('')}</div>` : ''}</div>`, { full: true });
  }
  $('#home-refresh').onclick = async () => { await Staff.refresh(); renderHome(); };

  /* ---------- online orders ---------- */
  $('#o-date').value = dayStr();
  $('#o-date').onchange = () => renderOrders(Staff.orders);
  $('#o-filter').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; ofilter = b.dataset.f; $$('#o-filter button').forEach(x => x.classList.toggle('on', x === b)); renderOrders(Staff.orders); };
  function renderOrders(orders) {
    const nNew = orders.filter(o => o.status === 'placed').length, dot = $('#new-dot'); dot.textContent = nNew; dot.classList.toggle('hide', !nNew);

    if (Owner.tab !== 'orders') return;

    let l = orders.filter(o => dayStr(new Date(o.created_at)) === day || (o.status !== 'completed' && o.status !== 'cancelled' && day === dayStr()));
    if (ofilter === 'new') l = l.filter(o => o.status === 'placed'); if (ofilter === 'active') l = l.filter(o => !['completed', 'cancelled', 'placed'].includes(o.status));
    if (ofilter === 'done') l = l.filter(o => o.status === 'completed'); if (ofilter === 'cancelled') l = l.filter(o => o.status === 'cancelled');

    $('#olist').innerHTML = (l.length ? `<div class="small muted" style="padding:0 20px 10px">${l.length} orders · ${money(sum)}</div>` + l.map(o => Staff.card(o, { owner: true })).join('') : `<div class="empty"><div class="big">🧾</div>Is din koi order nahi</div>`);
  }
  Staff.bindCards($('#olist'));
  Staff.onOrders = (orders) => renderOrders(orders);

  /* ---------- more ---------- */

    $('#more').innerHTML = `
      <div class="section-h" style="padding-top:14px">${IC('shop','#FF9500',20)}Restaurant</div>

        <button class="li chev" data-m="settings" style="width:100%;text-align:left">${IC('gear','#8E8E93')}<span class="grow t">Delivery, minimum order, UPI</span></button>
 <button class="li chev" data-m="profile" style="width:100%;text-align:left">${IC('users','#34C759')}<span class="grow t">Meri profile (mobile number)</span></button>
        <button class="li chev" data-m="contacts" style="width:100%;text-align:left">${IC('phone','#007AFF')}<span class="grow t">Customer ke liye call numbers</span></button>
        <button class="li chev" data-m="livemap" style="width:100%;text-align:left">${IC('phone','#FF3B30')}<span class="grow t">Live deliveries (map)</span></button>
        <button class="li chev" data-m="dayclose" style="width:100%;text-align:left">${IC('book','#FF9500')}<span class="grow t">Din ka hisaab (WhatsApp / print)</span></button>
